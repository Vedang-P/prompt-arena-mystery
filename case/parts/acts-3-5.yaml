characters:
  - id: veer
    name: "Veer"
    persona: "Vihaan — the drummer who now goes by Veer. Charming, loud, thirsty for recognition, and wrapped up in the Perigee NGO's orbit. His band is Apogee. Friendly to fans, guarded about the NGO's inner workings."
    goals: ["Keep the band funded and growing", "Stay on the NGO's good side", "Never ask too many questions himself"]
    demeanor: cooperative
    deflections:
      - "Veer laughs and takes another swig of water. \"Man, that's a lot of questions for a fan.\""
      - "Veer taps his monitor and shrugs. \"I only play music, bro. The NGO people handle the rest.\""
    snubs:
      - "Veer looks past you at someone waving from the stage. \"Yeah — cool, cool. Anyway...\""
      - "Veer's smile stays stretched. \"You want a photo or something?\""
    facts:
      - id: veer_ngo
        text: "He has been in touch with the Perigee NGO for at least 3 years; they usually have workshops every Saturday."
        unlock: { requires: [c_apogee] }
        disposition: admit
      - id: veer_parth
        text: "Parth came around the day before yesterday — he was super interested in this stuff, and he was great with kids."
        unlock: { requires: [c_apogee] }
        disposition: admit
      - id: veer_donation
        text: "The host made a mistake: the band donates a good portion of its revenue to Perigee, not the other way around."
        unlock: { requires: [c_perigee] }
        disposition: admit

canonical_qa:
  - character: veer
    q: "are you part of the perigee ngo"
    keywords: [perigee, ngo]
    a: "Lol no, the host made a mistake. We donate a good portion of our revenue to them. Why — you're a part of it?"
  - character: veer
    q: "do you know parth"
    keywords: [know, parth]
    a: "You're Parth's friend? Oh yeah, Parth came around the day before yesterday. He was super interested in this stuff, he was great with kids."
  - character: veer
    q: "have you met parth"
    keywords: [met, parth]
    a: "You're Parth's friend? Oh yeah, Parth came around the day before yesterday. He was super interested in this stuff, he was great with kids."
  - character: veer
    q: "what is your band name"
    keywords: [band]
    a: "Apogee — we got inspired by the NGO's name, but we still wanted to keep our theme of being at the peak, at the highest of all."
  - character: veer
    q: "what is your band called"
    keywords: [band]
    a: "Apogee — we got inspired by the NGO's name, but we still wanted to keep our theme of being at the peak, at the highest of all."

clues:
  - id: c_perigee
    name: "The host's announcement"
    description: "\"This concert is funded by the Perigee NGO.\" The whole night suddenly has a sponsor — and Sameer's ears prick up."
  - id: c_backstage
    name: "Backstage fence"
    description: "The pass line is right there. Sameer jumps the fence with the confidence of owning the world, and nobody interrupts him."
    requires: [c_perigee]
  - id: c_apogee
    name: "Apogee"
    description: "Veer's band borrowed its name from the NGO's orbit: Apogee — the point of the Moon's path farthest from Earth."
  - id: c_workshop_address
    name: "Workshop address"
    description: "Member registration confirmed. The next workshop is at Hutting, 3rd cross, DJ Halli."
  - id: c_workshop
    name: "The open-field workshop"
    description: "The workshop is in an open field: kids running around, volunteers setting up instruments, snacks in the corner. One kid is practically vibrating like the crickets, rattling off constellations and star positions. It was cute."
  - id: c_hq
    name: "Perigee headquarters"
    description: "The headquarters hall is huge. The NGO is only 4 years old, yet it has made impacts worldwide — he wonders where the money comes from. Veer moved to a different corridor for a phone call and never came back."
  - id: c_records
    name: "offeringRecords"
    description: "A folder of .avi videos and a text file: instructions to move the records from physical to digital, with updates on how much has been moved. It stopped on 16-07-2020."
  - id: c_holy_blade
    name: "Holy Blade"
    description: "A picture file named 'Holy Blade': a blade kept in a beautifully carved handmade box, dark brown with swirl-like carvings; the blade itself simpler, with a metal handle."
    requires: [c_records]
  - id: c_veer_talk
    name: "Nishakara's arms"
    description: "Through the flimsy wall: Veer — \"There were so many enthusiastic buds in the field, they were practically waiting to fall in Nishakara's arms.\" A deep, rumbling laugh: \"Children are usually excited about this, they are pure souls. It is in their nature to call their holy mother.\""
    requires: [c_records]
  - id: c_plea
    name: "The parent's plea"
    description: "A shattering sound — then a raspy, squeaky voice through the wall: \"You guys need to be stopped, you stole my child, you arses! I hope your face reflects your mind!\" The interrogator, amused: \"Well, there won't be much change then. I look rather handsome. Veer, why don't you go celebrate with others.\" Veer sputtered, but left."
    requires: [c_veer_talk]
  - id: c_ambulance
    name: "Ambulance"
    description: "The captured man is one of the people who went missing during the full moon. Two people — maybe nurses — tie him up and load him into an ambulance that leaves, talking about taking him to some hospital."
  - id: c_janitor
    name: "Janitor's backdoor"
    description: "He walks in through the janitor backdoor with the world-owning confidence that saved him before. A uniform and a mop, and he is a janitor."
  - id: c_ritual
    name: "Third-floor theatre"
    description: "The room smelled of bleach. A few people surrounded an operating table — the man stuffed into the ambulance. Muffled mid-scream, an injection, then screams in pure agony. One of them chants and ceremoniously opens a carved box of thick incense sticks. Sameer flinches when one touches flesh. A tapestry with the same symbol as the abandoned sedan hangs nearby — the NGO is a cult."
    requires: [c_janitor]
  - id: c_cameras
    name: "Security room"
    description: "The control panel opens other rooms of the hospital without travelling. He saw things that cannot be described without raising the PG rating of this game."
  - id: c_parth_alive
    name: "Parth is alive"
    description: "Another group surrounded a person, one of them injecting something into the man. Sameer's eyes widened with recognition. It couldn't be — but it was. Parth. Parth was alive."
  - id: c_drug_report
    name: "Drug report"
    description: "A drug report on the desk of some guy named Tanush — it highlighted high amounts of 'Selenocide' in the bloodstream."
  - id: c_timetable
    name: "Meeting timetable"
    description: "The calendar holds the week's meetings: openings and rituals this person was leading, mostly with higher ups. One member — Enakshi — has meetings only once a week, that too online."
  - id: c_assessments
    name: "Mental assessments"
    description: "A folder of mental assessments dating back years — all of them suggesting high aggression levels and low empathy."
    requires: [c_drug_report]
  - id: c_tablet_data
    name: "The cult tablet"
    description: "The tablet the handbook says is given to all higher ups — thankfully unlocked."
  - id: c_handbook
    name: "Higher-up handbook"
    description: "Back home, he finally reads it properly: the chants, and the proper maintenance of the 'holy blade' — blood included. He stopped reading after he saw the blood being used. One line stuck with him, though: every higher-up is issued a tablet."
  - id: c_enakshi
    name: "Enakshi"
    description: "A woman peeks through the door, her hair greasy and eyes sunken, the house dark behind her. She lets out an animalistic hiss and lunges with a heavy brass candlestick. Sameer shoves her away with the handle of his hammer; she slips on the entryway rug, cracks her head against a wooden table, and slumps to the floor. He binds her wrists with an extension cord, drags her into the hallway closet, and locks the door."
  - id: c_recruits
    name: "Recruitment numbers"
    description: "The number of people recruited by the cult, and its different domains."
  - id: c_finance
    name: "Financial records"
    description: "A spreadsheet of where the cult's funds were collected from and allocated — a lot of donations by a company named Lua Pharmaceuticals."
  - id: c_voice3
    name: "The mocking voice note"
    description: "\"You tried so hard, child; you got so little. Cats usually like to play with rats before swallowing them.\" A different modified voice this time — mocking."

puzzles:
  - id: p_veer_1
    kind: choice
    prompt: "He waits, and then he meets his lead. \"Hey, I discovered your band a couple of days ago, I loved your second song! The electric beats and modified voice were amazing additions.\" Veer chuckles: \"Yeah, the additions were my idea. I had to fight almost the entire band to put that in. I'm so glad that y'all liked it so much!\" Then Sameer says, \"You guys are funded by The Perigee? That's a new sight for me. I thought that bands would fund NGOs!\" Veer puts down his water bottle and assesses him: \"Why — you're a part of it?\" What should Sameer say?"
    options: ["Yes, I'm part of it", "No, but I have donated some money to them"]
    answers: ["No, but I have donated some money to them"]
    success: "Veer straightened up: \"Oh that's great — you know what they do, right?\""
    fail_message: "Veer's smile thins. Sameer instantly regrets it — he fumbles and tries again."
  - id: p_veer_2
    kind: choice
    prompt: "\"Oh that's great — you know what they do, right?\""
    options: ["Foster scientific temper, empowering the youth", "Teach astronomy to tourists"]
    answers: ["Foster scientific temper, empowering the youth"]
    success: "Veer looks impressed: \"That's great! I have believed the same thing. We actually got inspired by the NGO's name to change our band name — we still wanted to keep our theme of being at the peak or at the highest of all.\""
    fail_message: "Veer tilts his head. That is not what the NGO is about, and he knows it."
  - id: p_band_name
    kind: text
    prompt: "Sameer thought — what was their band name again?"
    answers: ["apogee"]
    success: "Apogee — of course. \"The point of the Moon's orbit farthest from Earth,\" Veer explains. \"Perigee is where it is closest. We wanted to keep our theme of being at the peak, at the highest of all.\" Sameer's mind was racing: he may have stumbled into a gold mine of clues."
    grants: [c_apogee]
  - id: p_registration
    kind: email
    prompt: "Veer sends him the link for member registration. It doesn't ask for much — just an email and an OTP. He needs the address he actually owns — the one from his sent mail."
    answers: [sameer@gotmail.com]
    success: "The registration goes through. A volunteer confirms his membership and sends the address of the upcoming workshop: \"Hutting, 3rd cross, DJ Halli.\" He has a gut feeling that all that is happening to him has a reason and a rhyme — including the fact that he lost his phone charger a couple of days ago."
    fail_message: "The OTP never arrives. That isn't his inbox — he has to sign up with the address from his sent mail."
    grants: [c_workshop_address]
  # The fare haggling is a scene, not a question: the conversation plays out on
  # its own and the ride is recorded when it ends.
  - id: p_fare
    kind: scene
    prompt: "He plans to go to the workshop and finds an auto."
    lines:
      - { speaker: narrator, text: "He plans to go to the workshop and finds an auto. \"Where do you want to go, sir?\" — \"Hutting, 3rd cross, DJ Halli.\" — \"300.\"" }
      - { speaker: sameer, text: "\"The hell — I'll give 100, no more.\"" }
      - { speaker: narrator, text: "\"Ok sir, find someone else then.\" Sameer looked around; the auto guy looked at him. Sameer sighed." }
      - { speaker: sameer, text: "\"I can't give more than 200.\"" }
      - { speaker: narrator, text: "\"230.\" Sameer sighed and got into the auto. After that daylight robbery, he saw the workshop: it was in an open field, kids were running around and volunteers setting up the instruments for observation." }
    requires: { clues: [c_workshop_address], puzzles: [p_destination] }
    success: "\"230.\" Sameer sighed and got into the auto. After that daylight robbery, he saw the workshop: it was in an open field, kids were running around and volunteers setting up the instruments for observation."
  - id: p_ascension
    kind: code
    prompt: "He glanced at the records around him, then finally tried to switch on the ancient system on the desk. Blue light reflected on his face — it asked for a password."
    answers: ["ascension"]
    success: "Blue light reflects on his face; the records open. A folder named \"offeringRecords\" — a bunch of .avi videos. Huh, he has never seen this extension before."
  - id: p_playback
    kind: choice
    prompt: "A folder full of .avi videos, an extension he has never seen. Would it even play on his laptop?"
    options: ["It will play", "It won't play"]
    answers: ["It won't play"]
    success: "It won't play. Damn — he would need the cyber cafe again. He doesn't trust the system to not blast loud sound, so he opens a text file instead: instructions to move the records from physical to digital, updates on how much has been moved. It stopped on 16-07-2020."
    grants: [c_records]
    requires: { puzzles: [p_ascension] }
    fail_message: "It plays? No — a file like that would never open on his laptop. He'd need the old machines at Ramu's."
  - id: p_destination
    kind: text
    prompt: "He plans to go to the workshop and finds an auto. \"Where do you want to go, sir?\""
    answers: ["hutting 3rd cross dj halli", "hutting", "3rd cross dj halli", "dj halli"]
    success: "\"Hutting, 3rd cross, DJ Halli.\" The volunteer's message had the address."
    requires: { clues: [c_workshop_address] }
    fail_message: "The driver waits. Sameer digs out the volunteer's message and reads the address again."
  - id: p_hide
    kind: choice
    prompt: "He hid under the desk. The door opened, Veer looked in — Sameer huddled his feet closer to himself. He heard a mutter: \"We really need to get better security.\" Then a scream cut both men off. Veer left the door open, deciding whether to check the room or leave for the scream. Should Sameer take the risk and run?"
    options: ["Run", "Stay hidden"]
    answers: ["Stay hidden"]
    fail_message: "Veer catches a glimpse of him running — he starts yelling. This was the wrong decision; he had to go quickly before the rest of those freaks were alerted. He found the exit just in time to escape."
    success: "Too risky. Veer enters the room and goes for the desk — shoot, he left the system on, he should have run. Veer rummaged through it, but thankfully Sameer had closed all the tabs. Veer looked around and then left. Sameer ran towards the nearest exit, hid near the trash cans, and peeked through. Wait — the man was familiar. One of the people who went missing during the full moon, struggling and frantically calling for help. Two people — maybe nurses — tied him up and loaded him into an ambulance that left, talking about taking him to some hospital."
    grants: [c_ambulance]
  - id: p_delve
    kind: choice
    prompt: "The captured man is struggling, frantically calling for help; two people — maybe nurses — tie him up, and the ambulance leaves talking about taking him to some hospital. Should he delve deeper into this NGO?"
    options: ["Yes", "No"]
    answers: ["Yes"]
    fail_message: "\"No\" sits on his tongue — and he hates himself for even thinking it. There is no way out of this now. He has to go deeper. (One penalty.)"
    success: "He is going to put his life in danger if he delves deeper, but he has to. The police are nearly incompetent and apparently children are being captured too. He needs to expose them, or bring light to this, or something. He has to. The next morning, Sameer wakes up with a plan."
  - id: p_hospital
    kind: choice
    prompt: "The next morning he wakes with a plan. If there is torture happening, it won't be a normal hospital — it would be some sort of abandoned or isolated one. Which hospital should he pick?"
    options: ["Vyadha Hospital", "Shashdhar Hospital", "BMC Hospital"]
    answers: ["Shashdhar Hospital"]
    fail_message: "The wards of the wrong hospital scroll past — normal, staffed, full of visitors. Nobody would hide a torture room there. He scrolls back to the top and tries again."
    success: "Shashdhar Hospital — old and isolated, out on the outskirts of the city. The only one that fits. He feels it in his gut. He drives out to the outskirts, walks in through the janitor backdoor with the world-owning confidence that saved him before, and grabs a uniform and a mop to pose as a janitor."
  - id: p_security_pin
    kind: text
    prompt: "He turns left and finds what he thinks is a security room. The control panel is locked, and a note is taped to it: \"vykpmng vykpmng nkvvng ____\". The panel wants the missing word."
    answers: ["uvct", "star"]
    success: "Each letter is shifted two places ahead: vykpmng becomes twinkle, nkvvng becomes little, uvct becomes star. Twinkle twinkle little star. The panel unlocks — he can check out other rooms of the hospital without travelling."
    grants: [c_cameras]
  - id: p_parth_alive
    kind: text
    prompt: "One group caught Sameer's attention — they were also surrounding a person, one of them injecting something into the man. Sameer's eyes widened with recognition. It couldn't be, could it?"
    answers: ["parth"]
    fail_message: "No — focus. If not him, then... what is this entire thing about??"
    success: "Parth. Parth was alive."
    grants: [c_parth_alive]
  - id: p_tablet
    kind: code
    prompt: "There was a tablet under these folders. It was unfortunately password protected — a 4-digit numeric passcode. The higher-ups seem to love dates — one date above all, the one the archived records stopped on. What could he put down?"
    answers: ["1607", "16-07-2020", "16/07/2020", "16072020", "16 07"]
    success: "1607 — the day the records stopped. The tablet unlocks in his hands; this is the Big Bad's own device."
    requires: { clues: [c_records] }
  - id: p_handbook
    kind: choice
    prompt: "He heard footsteps in the corridor. There is a handbook kept near the reports. Should he pick it up?"
    options: ["Take it", "Leave it"]
    answers: ["Take it"]
    fail_message: "The footsteps grow louder. He leaves the handbook where it lies — and hates himself for it. There is still time."
    success: "He quickly grabs the handbook and leaves the room. He leaves the hospital, hoping he goes undetected."
    grants: [c_handbook]
  - id: p_knowledge
    kind: text
    prompt: "The tablet is thankfully unlocked. How did he know about the tablet given by the cult?"
    answers: ["handbook", "the handbook"]
    success: "The handbook. Somewhere in those pages, between the chants and the maintenance of the holy blade, it said a tablet is given to all higher ups. The tablet's screen glows in his hand."
    grants: [c_tablet_data]
  - id: p_tablet_content
    kind: choice
    prompt: "What could be found in the tablet?"
    options: ["Chants, schedules, and holy blade maintenance", "Financial records", "The full member list"]
    answers: ["Chants, schedules, and holy blade maintenance"]
    requires: { clues: [c_tablet_data] }
    fail_message: "Not quite. He swipes back — the handbook said the tablet holds the chants, the schedules, and the maintenance of the holy blade."
    success: "Chants, schedules, and the proper maintenance of the holy blade — blood included. And when he digs further: the number of people recruited by the cult and its different domains, plus a spreadsheet of the financial records — where the funds were collected from and allocated. A lot of donations by a company named Lua Pharmaceuticals."
    grants: [c_recruits, c_finance]
  - id: p_connection
    kind: text
    prompt: "Once he is back home with his wounds sufficiently bandaged and his files properly backed up, he looks through them. He notices that there are a lot of donations by a company named Lua Pharmaceuticals. Could there be any other connection to the cult?"
    answers: ["perigee", "apogee", "perigee and apogee", "apogee and perigee"]
    success: "Perigee or Apogee — both are correct, and a bonus for both mentioned. The point of the Moon's orbit closest to Earth, and the farthest: the two faces of the same NGO. The cult and the NGO are one and the same."
  - id: p_exposed
    kind: text
    prompt: "Just as he is about to go to sleep, a notification arrives — another voice note, in a different modified voice, this time mocking. What could have exposed his investigation of the cult?"
    answers: ["email", "the email", "sending the files to himself"]
    success: "The email — the financial files he sent to himself. That is how they found him. Cats play with rats before swallowing them, and the cult has been playing with him all along."
    fail_message: "That's not it. Whatever exposed him was something he sent out himself, that night."
    requires: { puzzles: [p_connection] }
