# W2 — acts 3–5 ("The Concert", "Shashdhar", "The Big Bad").
# Source: docs/FINAL_STORY.md and docs/FINAL_STORY_WITH_QUESTIONS.md (acts 3–5). Registry: docs/BUILD_SPEC.md.
# Owns: acts 3/4/5, rooms concert/workshop/ngo_hq/ngo_archive, hospital act4
# hotspots, tanush_office, enakshi_house, sameer_room act4/act5 hotspots.

acts:
  - id: act3
    type: interactive
    kicker: "Act III"
    title: "The Concert"
    entry_room: concert
    rooms: [concert, workshop, ngo_hq, ngo_archive, sameer_room]
    objective: "Follow Veer and the Perigee NGO. Find out what Parth was doing there."
    intro:
      - { speaker: narrator, text: "Sameer is in the concert. There is not much crowd, but the vibes are good — he wishes there was a water station around, or maybe food stalls. It's really just a temporary stage propped up; the lights are cool though." }
      - { speaker: narrator, text: "The band is a mix of industrial rock and electronic dance. They all have voice modifiers and rely on heavy synthesizers. He honestly enjoys the music — he should search it up later." }
      - { speaker: narrator, text: "As the band closes, the host takes the mic: \"This concert is funded by the Perigee NGO.\" This makes Sameer's ears prick up. He needs to talk to Veer — or Vihaan, whoever this guy is. This may be the only lead he has to his friend." }
      - { speaker: narrator, text: "He looks around as the concert ends and spots a line for people with backstage passes. Now he just needs to go in." }
    outro:
      - { speaker: narrator, text: "Holy hell, the design was so cool. Then — a sound from the next room. He quickly closed the door and stayed as silent as possible. The volunteers would have left by now." }
      - { speaker: narrator, text: "The walls were flimsy. Through them, he heard Veer speak." }
      # Act IV's opening was still Act III: the overheard call and the parent's
      # plea run in the archive room, up to the moment Sameer hides under the desk.
      - { speaker: narrator, text: "Through the flimsy wall: Veer — \"There were so many enthusiastic buds in the field, they were practically waiting to fall in Nishakara's arms.\"" }
      - { speaker: narrator, text: "A deep, rumbling laugh answered him: \"Children are usually excited about this. They are pure souls. It is in their nature to call their holy mother.\"" }
      - { speaker: narrator, text: "A shattering sound — as if a pot had been dropped. Silence for a few seconds; the only sound was Sameer's heartbeat. Then yelling, and screaming. Someone else was in the room, and he had been caught." }
      - { speaker: narrator, text: "The deep voice: \"What were you trying to find, child?\" A new voice, raspy and squeaky, like nails on a chalkboard: \"I got lost, I wanted to go to the washroom.\" Veer: \"With your phone recording the conversation?\"" }
      - { speaker: narrator, text: "\"You guys need to be stopped — you stole my child, you arses! I hope your face reflects your mind!\" The interrogator, amused: \"Well, there won't be much change then. I look rather handsome. Veer, why don't you go celebrate with the others. I want to talk to him — he looks like he has a story to tell.\"" }
      - { speaker: narrator, text: "Veer sputtered, but left. Sameer heard the door swing. He hid under the desk." }
    complete: { clues: [c_records, c_holy_blade, c_veer_talk, c_plea] }

  - id: act4
    type: interactive
    kicker: "Act IV"
    title: "Shashdhar"
    entry_room: ngo_archive
    rooms: [ngo_archive, sameer_room, hospital]
    objective: "Escape the archive, then find the hospital the man from the ambulance was taken to."
    outro:
      - { speaker: narrator, text: "Parth was alive." }
    complete: { clues: [c_janitor, c_ritual], puzzles: [p_hide, p_delve, p_hospital, p_security_pin, p_parth_alive] }

  - id: act5
    type: interactive
    kicker: "Act V"
    title: "The Big Bad"
    entry_room: tanush_office
    rooms: [tanush_office, enakshi_house, sameer_room]
    objective: "Expose the cult. Gather proof from the Big Bad's office and from Enakshi's house."
    intro:
      - { speaker: narrator, text: "Holy shit, Parth was alive. Sameer wanted to dance, he wanted to scream; he honestly felt a wave of numbness go over him. He had been panicking so much — and all for naught. Parth was alive; maybe starving, but still healthy. He wasn't covered with bruises and burns. That was more than enough." }
      - { speaker: narrator, text: "He can't act like a fool right now. He has no idea who Parth is against and who he is allied with; one wrong move and it could be his skin being burned." }
      - { speaker: narrator, text: "He hears the security guard coming and picks up the mop. The guard looks at him in disgust: \"How many times have I told you to not come so close to the systems!\" Sameer looks to the ground: \"There were crumbs near the screens.\" The guard looks him over — \"You're Shyam's replacement?\" — \"Huh, yeah, I was hired yesterday. He loved my mopping technique. You know, just swish and flick.\"" }
      - { speaker: narrator, text: "A swish and a flick, and he was outside the door. He wants to go home and sleep, maybe yell at Parth for getting him into this goose chase — then he finds a beautifully decorated room, with plush carpets and mahogany furniture, a stark difference from the sterile corridors of the hospital. This has to be the office of some higher up." }
    outro:
      - { speaker: narrator, text: "He's been staring at his phone for about 3 hours now; that's not so bad if you consider his doomscrolling times. It was hard work for his brain, especially when he can't properly connect and visualise the data." }
      - { speaker: narrator, text: "Just as he is about to go to sleep, he gets a notification. Another voice note — a different modified voice this time, mocking: \"You tried so hard, child; you got so little. Cats usually like to play with rats before swallowing them.\"" }
      - { speaker: narrator, text: "The email he sent to himself gave him away. A deranged cult is following him now, and he is awake the entire night in terror." }
    complete: { puzzles: [p_exposed] }

