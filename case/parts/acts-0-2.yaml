# The Moon's Dark Side — W1 fragment: Acts 0, 1, 2.
# Owned by workstream W1. Merged by scripts/merge-case.mjs into case/main.yaml.
# Registry and schema: docs/BUILD_SPEC.md. Story: docs/FINAL_STORY.md and docs/FINAL_STORY_WITH_QUESTIONS.md.

acts:
  - id: act0
    type: cinematic
    kicker: "Act 0"
    title: "The Vanishing"
    subtitle: "No clue. A dead end — and then a beep."
    scenes: [gazebo, parth_home, police_station, sameer_room]
    beats:
      - id: gazebo_dusk
        room: gazebo
        shot: wide
        seconds: 9
        caption: "Yesterday · 6:42 PM"
        cast:
          - { character: sameer, at: [-0.7, 0.1], rot: 0.55, pose: sit }
          - { character: parth, at: [0.75, 0.05], rot: -0.55, pose: sit }
        lines:
          - { speaker: narrator, text: "An eventful day for Sameer and Parth — the streets, then a lazy evening at Parth's home, and now the park, as the light settles around the gazebo." }
          - { speaker: parth, text: "Nothing, man. Just trying to get an internship." }
          - { speaker: sameer, text: "Same. Honestly, today was the first time I didn't think about Jade Street all day." }
      - id: gazebo_talk
        room: gazebo
        shot: two
        seconds: 11
        caption: "Yesterday · 6:42 PM"
        cast:
          - { character: sameer, at: [-0.7, 0.1], rot: 0.55, pose: sit }
          - { character: parth, at: [0.75, 0.05], rot: -0.55, pose: sit }
        lines:
          - { speaker: parth, text: "You know how it goes — recruiters ghost you after making you run around." }
          - { speaker: narrator, text: "Sameer pleaded," }
          - { speaker: sameer, text: "Dude, I think Jade Street just ghosted me. Let me have some hope — maybe they're still deciding." }
          - { speaker: parth, text: "Right. The AI reviewing your resume would take three days?" }
      - id: gazebo_call
        room: gazebo
        shot: close_parth
        seconds: 10
        caption: "Yesterday · 6:42 PM"
        cast:
          - { character: sameer, at: [-0.7, 0.1], rot: 0.55, pose: sit }
          - { character: parth, at: [0.75, 0.05], rot: -0.55, pose: sit }
        lines:
          - { speaker: narrator, text: "Parth's phone rings. He picks it up and listens — not a word. Sameer notices his friend looks a little disheveled — maybe it's the light." }
          - { speaker: parth, text: "Alright, I gotta go. Mum's calling. Tomorrow — same time?" }
          - { speaker: sameer, text: "Yeah, yeah, dude." }
      - id: gazebo_alone
        room: gazebo
        shot: wide
        seconds: 7
        caption: "Yesterday · 6:42 PM"
        cast:
          - { character: sameer, at: [-0.4, 0.3], rot: 0.2 }
        lines:
          - { speaker: narrator, text: "And then he ran off. Weird. Parth left earlier than usual. Sameer walks home alone." }
      - id: gazebo_nextday
        room: gazebo
        shot: wide
        seconds: 10
        caption: "Today · 6:30 PM"
        cast:
          - { character: sameer, at: [-0.4, 0.3], rot: 0.2 }
        lines:
          - { speaker: narrator, text: "The next day, Sameer is back at the park. Fifteen minutes pass. Then the calls — one, two… the fifth in ten minutes. No answer." }
          - { speaker: sameer, text: "Pick up, man. This isn't funny." }
      - id: hall_mother
        room: parth_home
        shot: two
        seconds: 11
        cast:
          - { character: sameer, at: [-0.6, 0.6], rot: 0.3 }
          - { character: mother, at: [0.7, -0.2], rot: -0.35 }
        lines:
          - { speaker: mother, text: "Oh hello beta. You and Parth got bored already?" }
          - { speaker: sameer, text: "No, aunty — Parth didn't come at all. I came to take him with me." }
          - { speaker: mother, text: "But he left home about an hour ago..?" }
          - { speaker: sameer, text: "What?!" }
      - id: hall_search
        room: parth_home
        shot: wide
        seconds: 9
        cast:
          - { character: sameer, at: [-0.6, 0.6], rot: 0.3 }
          - { character: mother, at: [0.7, -0.2], rot: -0.35 }
        lines:
          - { speaker: narrator, text: "His favourite cafe. The football stands. The library. The park again. Two, three hours of calling. Parth is nowhere to be found." }
      - id: station_open
        room: police_station
        shot: wide
        seconds: 9
        cast:
          - { character: sameer, at: [-0.9, 0.6], rot: 0.25 }
          - { character: mother, at: [-0.3, 0.78], rot: 0.1 }
          - { character: officer, at: [0.5, -0.08], rot: -0.2, pose: sit }
        lines:
          - { speaker: narrator, text: "The police station is crowded and migraine-inducing, as all government offices are. The officer is having a masala dosa, flipping through cases with greasy fingers." }
      - id: station_q1
        room: police_station
        shot: two
        seconds: 12
        cast:
          - { character: sameer, at: [-0.9, 0.6], rot: 0.25 }
          - { character: mother, at: [-0.3, 0.78], rot: 0.1 }
          - { character: officer, at: [0.5, -0.08], rot: -0.2, pose: sit }
        lines:
          - { speaker: mother, text: "My son is missing! We can't contact him. His name is Parth." }
          - { speaker: officer, text: "How long has it been since you last saw him, ma'am?" }
          - { speaker: sameer, text: "Somewhere between two and three hours." }
          - { speaker: officer, text: "Ma'am, we will try our best to look for him — but don't get your hopes too high. He might be at someone else's home. Have you checked?" }
          - { speaker: mother, text: "Yes. Everywhere we can think of." }
      - id: station_q2
        room: police_station
        shot: close_officer
        seconds: 12
        cast:
          - { character: sameer, at: [-0.9, 0.6], rot: 0.25 }
          - { character: mother, at: [-0.3, 0.78], rot: 0.1 }
          - { character: officer, at: [0.5, -0.08], rot: -0.2, pose: sit }
        lines:
          - { speaker: officer, text: "When and where did you last see him?" }
          - { speaker: sameer, text: "In the park. Yesterday evening." }
          - { speaker: officer, text: "Was there anything odd about him, when you last saw him?" }
          - { speaker: sameer, text: "He left early — after getting a call from his mother." }
      - id: station_lie
        room: police_station
        shot: close_mother
        seconds: 9
        cast:
          - { character: mother, at: [-0.3, 0.78], rot: 0.1 }
        lines:
          - { speaker: mother, text: "I didn't call him. He told me you had left early." }
          - { speaker: narrator, text: "Sameer and Parth's mother look at each other in confusion. Parth had lied to both of them. But why?" }
      - id: station_end
        room: police_station
        shot: wide
        seconds: 8
        cast:
          - { character: sameer, at: [-0.9, 0.6], rot: 0.25 }
          - { character: mother, at: [-0.3, 0.78], rot: 0.1 }
          - { character: officer, at: [0.5, -0.08], rot: -0.2, pose: sit }
        lines:
          - { speaker: officer, text: "We'll file the missing person case — but I can't give you any guarantee." }
          - { speaker: narrator, text: "No clue. A dead end. They leave the station with nothing." }
      - id: room_beep
        room: sameer_room
        shot: close_desk
        seconds: 9
        cast:
          - { character: sameer, at: [0.2, 0.6], rot: 0.15, pose: sit }
        lines:
          - { speaker: narrator, text: "Sameer goes home stressed. Cold leftovers, no energy to cook. Just as he's about to sleep — a beep." }
          - { speaker: narrator, text: "A notification from Parth. A voice note." }
      - id: room_call
        room: sameer_room
        shot: two
        seconds: 7
        cast:
          - { character: sameer, at: [0.2, 0.6], rot: 0.15, pose: sit }
        lines:
          - { speaker: sameer, text: "Come on, pick up. Please." }
          - { speaker: narrator, text: "The call doesn't connect. There is nothing left to do but listen." }
      - id: room_voicenote
        room: sameer_room
        shot: close_desk
        seconds: 18
        overlay: phone_voicenote
        cast:
          - { character: sameer, at: [0.2, 0.6], rot: 0.15, pose: sit }
        lines:
          - { speaker: voice, text: "The moon has a dark side you never see," }
          - { speaker: voice, text: "Some secrets even light can't reach," }
          - { speaker: voice, text: "Look where his thoughts rest," }
          - { speaker: voice, text: "Where he hides what he knows best." }
          - { speaker: voice, text: "The room may hold what he never said," }
          - { speaker: voice, text: "A truth better left unread." }
          - { speaker: voice, text: "So tread carefully, and look behind…" }
          - { speaker: voice, text: "You may not like what you're about to find." }
      - id: room_end
        room: sameer_room
        shot: wide
        seconds: 9
        cast:
          - { character: sameer, at: [0.2, 0.6], rot: 0.15, pose: sit }
        lines:
          - { speaker: narrator, text: "Shivers run down his spine. The voice is deep, mocking, warped — it doesn't belong to Parth." }
          - { speaker: sameer, text: "Jade Street ghosted me… but you didn't. Who are you?" }

  - id: act1
    type: interactive
    kicker: "Act I"
    title: "The Room"
    entry_room: parth_room
    rooms: [parth_room, abandoned_field, cyber_cafe, parth_home]
    intro:
      - { speaker: narrator, text: "Sameer goes to Parth's home. He meets Parth's mother — she looks as if she hasn't slept at all since the day her son went missing. She still smiles at him, with a lot of effort." }
      - { speaker: narrator, text: "Small talk first — the neighbours, the tea, the rain — while a rock sits in his throat the whole time." }
      - { speaker: sameer, text: "I would like to go to Parth's room, aunty." }
      - { speaker: narrator, text: "His mum looks up the stairs with unshed tears, looks at Sameer, then allows him." }
      - { speaker: mother, text: "Please don't disturb anything in his room. Parth may have a hard time finding stuff once he comes back." }
      - { speaker: narrator, text: "Sameer runs up the stairs." }
      - { speaker: narrator, text: "He finds himself in Parth's room. He sits on the unmade bed and looks around — his gaze falls on the laptop, sitting open in sleep mode." }
    outro:
      - { speaker: narrator, text: "He looked through every video of Parth and Vihaan but found nothing else. With a resigned look he bid farewell to Parth's mother and left." }
      - { speaker: sameer, text: "I'll find you, man. I promise." }
    complete:
      puzzles: [p_morse, p_laptop, p_email, p_cassette, p_drums]

  - id: act2
    type: interactive
    kicker: "Act II"
    title: "Full Moon"
    entry_room: sameer_room
    rooms: [sameer_room, gazebo, cyber_cafe]
    intro:
      - { speaker: narrator, text: "He felt sick — Parth had a whole life he was only finding out about, one abandoned car's mixtape at a time. He tries to ignore the teeny tiny piece of horribly sickening revelation at the back of his mind — he does this by going to the store to find something to eat." }
      - { speaker: narrator, text: "He is bombarded at the entrance by someone from a non-profit organisation. One can figure out if a person is from an NGO by a smile that stretches across their face but there is no crinkle near the eye. He tried ignoring, but another person stepped in front of him, the same stretched smile spooking him. He stopped and tiredly signalled them to tell him what they wanted.", shot: crowd }
      - { speaker: narrator, text: "The one right in front of him pushed a pamphlet into his hands. It was apparently Perigee — a worldwide NGO working towards the mission of fostering scientific temperament throughout the underprivileged youth — they were going to have a huge astronomy event in a few days. They had quite a few notable achievements, like the largest astronomy workshop organised in Nigeria just a year ago.", shot: crowd }
      - { speaker: narrator, text: "He is impressed. He opens his wallet to give out 10 rupees. The worker at his side looks into his wallet; Sameer falls for their judgement and pulls out the 50 rupee note. He uses all his interview-larping skills to protect his last 30 rupees and makes a quick exit.", shot: crowd }
      - { speaker: narrator, text: "He somehow reaches Ramu's Dosa Corner — Parth loved the place for some reason. He feels nostalgic and orders Parth's usual." }
      - { speaker: narrator, text: "He eats it and stumbles back home, the dosa weighing his stomach and the bag weighing his back. He crashes on his bed." }
      - { speaker: narrator, text: "When he wakes, the phone is showing 11:30 am. There was a new voice note from Parth." }
    outro:
      - { speaker: narrator, text: "Normal ticket. He really doesn't want to do this — he doesn't want to involve more people into this than required." }
      - { speaker: sameer, text: "This is either the lead of my life or the most expensive dead end ever." }
      - { speaker: narrator, text: "His head throbs — the usual marker to stop using his head for the day. He falls asleep." }
    complete:
      puzzles: [p_voicenote2, p_dosa, p_ticket]

