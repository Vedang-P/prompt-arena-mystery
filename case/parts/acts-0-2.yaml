    name: "Locked laptop"
    description: "Parth's laptop sits open in sleep mode, password protected. Sameer tries a guess — the field shakes. The screen offers a hint instead: \"Look where my loudest secrets are kept, away from prying eyes, leather bound and stained with ink.\""
    grants: []
  - id: c_morse
    name: "Decoded diary message"
    description: "The dots and dashes decode to \"OC1808 in laptop.\" A very strange combination to encode — and stranger still that Parth bothered."
    grants: []
