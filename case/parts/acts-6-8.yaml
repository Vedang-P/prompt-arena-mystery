# W3 — Acts VI–VIII ("Poornima", "The Mask", "The Revelation").
# Owner: case/parts/acts-6-8.yaml. Do not edit case/main.yaml (generated).
# Prose follows docs/FINAL_STORY.md and docs/FINAL_STORY_WITH_QUESTIONS.md (acts 6–8) nearly verbatim.
# This fragment only adds hotspots to existing rooms — it never redefines a room
# it does not own. Act/room/puzzle/clue ids follow the frozen BUILD_SPEC registry.

acts:
  - id: act6
    type: interactive
    kicker: "Act VI"
    title: "Poornima"
    entry_room: sameer_room
    rooms: [sameer_room, hospital, police_station]
    intro:
      - { speaker: narrator, text: "Sameer sees the light shining through the curtains. He was awake the entire night in terror." }
      - { speaker: narrator, text: "He has tried everything, and yet he hasn't come close to trying to expose the cult. He has a repository of information, yet none of it can be legally traced back to the cult." }
      - { speaker: narrator, text: "He needs to go to the hospital for some actual proof. Yet he is paralysed by the fact that a deranged cult is following him — he's not even sure if he wants to get out of bed at this point." }
      - { speaker: narrator, text: "He opens his phone and looks at the date. There is a notification today for Poornima." }
    outro:
      - { speaker: narrator, text: "The police take in all of this and mark it. The officers tell him that they will comb over this all and may call him anytime this week. Sameer agrees and is let out of the station." }
      - { speaker: narrator, text: "He goes home. On his bed, a wendigo mask is kept." }
    complete: { clues: [], puzzles: [p_police_video] }

  - id: act7
    type: interactive
    kicker: "Act VII"
    title: "The Mask"
    entry_room: sameer_room
    rooms: [sameer_room, hospital, enakshi_house]
    intro:
      - { speaker: narrator, text: "On his bed, the mask — decorated too, with beautiful lace tied around the horns. Why was it here, how was it here? Was it the police? Did he do the wrong thing by taking all the evidence to the police?" }
      - { speaker: narrator, text: "Before he could fall into a spiral, he hears the door knock. Sameer peeked through — it was Veer. He looked unarmed, but Sameer kept his trusty hammer with him. He opened the door." }
      - { speaker: veer, text: "How the hell did you know about us? You couldn't keep your nose from sniffing about." }
      - { speaker: narrator, text: "Sameer saw for the first time how pathetic Veer looked." }
      - { speaker: sameer, text: "What are you talking about?" }
      - { speaker: veer, text: "I'm hearing from my dad that you apparently got folders full of information. I swear to god, if my name comes in the cult, I will —" }
      - { speaker: narrator, text: "Someone walks in hearing distance. Sameer looks at the guy, then back at Veer. He could get something from him right now." }
    outro:
      - { speaker: narrator, text: "The leader grabbed the mask from Sameer's bag, put it on him and pushed him into the room. Identical masks turned towards him. He took a seat near the back; the leader closed the door and walked to the podium." }
      - { speaker: leader, text: "I was naive at the start, like we all are. I didn't know nor was taught about our holy mother. She was always protecting us. Forget respecting — the lower monkeys didn't even look at her." }
      - { speaker: leader, text: "I had been at a very low point in my life, taking all sorts of things. I saw her — she cried, asking me why I was destroying myself. What did she do wrong?" }
      - { speaker: narrator, text: "The leader wiped his eyes; the people in front of him wailed. A low-lying fog released. Damn, this man was dramatic." }
      - { speaker: leader, text: "Friends, I had seen divinity. The Moon Goddess had begged me to stop. Who am I but a humble mortal to follow her? I had to share this revelation with everyone I could. People rejected — the worst was when I couldn't share it with the future, our children." }
      - { speaker: leader, text: "Shouldn't they have the right to know their holy mother?" }
      - { speaker: leader, text: "Shouldn't they be grateful for her protection from the horrors out there?" }
      - { speaker: narrator, text: "The crowd roared, then went animalistic — no different from a bunch of dogs barking. The smoke rose higher; the people were nothing more than their masks. Sameer felt numb." }
    complete: { clues: [], puzzles: [p_hand_owner, p_floor] }

  - id: act8
    type: interactive
    kicker: "Act VIII"
    title: "The Revelation"
    entry_room: hospital
    rooms: [hospital, tanush_office]
    intro:
      - { speaker: narrator, text: "Sameer looked around — the noises were too loud. He started yelling nonsense; he couldn't hear himself. It was getting humid. Colours bombarded him, the leader's voice the only thing to focus on. It was as if he was stoking the flame of barbarism in the room." }
      - { speaker: narrator, text: "He went towards the podium, towards his thread of sanity. Up front, he saw Veer go to the stage. The leader gestured to him." }
    outro:
      - { speaker: narrator, text: "He reaches the end of the corridor. He climbs on the window frame. He gazes at the burning room — the leader's face melted, muscle fibers charred." }
      - { speaker: narrator, text: "The entire point of this ordeal was to find Parth, and though he found him, he was unable to save him." }
      - { speaker: narrator, text: "Sameer is found back in his room, waking up to a new day. The birds are chirping and the sun is shining. He looks panicked — how did he get here? He was at the hospital, right?" }
      - { speaker: narrator, text: "There is a ping on his phone. A new voice note: \"You're not needed anymore. Your work is done. Now disappear.\" Sameer looks at the screen in confusion. The screen goes dark all of a sudden." }
    complete: { clues: [c_office], puzzles: [p_office, p_found, p_saved] }

