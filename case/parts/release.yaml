    objective: "Search Parth's room, follow the coordinates to the field, then trace the cassettes and Vihaan."
    complete:
      clues: [c_reports, c_email, c_coords, c_sedan, c_backpack, c_mixtape, c_videos]
      puzzles: [p_morse, p_laptop, p_email, p_cassette, p_drums]
  - id: act2
    objective: "Chase the park CD, watch the videos, and find out who Veer is."
    complete:
      clues: [c_cd, c_footage, c_veer_profile, c_ticket]
      puzzles: [p_voicenote2, p_dosa, p_ticket]
  - id: act4
    complete:
      clues: [c_janitor, c_ritual]
      puzzles: [p_hospital, p_security_pin, p_parth_alive]
  - id: act5
    complete:
      clues: [c_drug_report, c_timetable, c_assessments, c_handbook, c_recruits, c_finance, c_voice3]
      puzzles: [p_tablet, p_handbook, p_knowledge, p_tablet_content, p_connection, p_exposed]
  - id: act7
    complete:
      puzzles: [p_mask_owner, p_veer_mask, p_lua, p_nigeria, p_continue, p_floor]
  - id: act8
