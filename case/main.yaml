  - id: act6
    type: interactive
    kicker: Act VI
    title: Poornima
    entry_room: sameer_room
    rooms:
      - sameer_room
      - hospital
      - police_station
    objective: Get real proof from Shashdhar Hospital — before Poornima ends.
    intro:
      - speaker: narrator
        text: Sameer sees the light shining through the curtains. He was awake the entire night in terror.
      - speaker: narrator
        text: He has tried everything, and yet he hasn't come close to trying to expose the cult. He has a repository of information, yet none of it can be legally traced back to the cult.
      - speaker: narrator
        text: He needs to go to the hospital for some actual proof. Yet he is paralysed by the fact that a deranged cult is following him — he's not even sure if he wants to get out of bed at this point.
      - speaker: narrator
        text: He opens his phone and looks at the date. There is a notification today for Poornima.
    outro:
      - speaker: narrator
        text: The police take in all of this and mark it. The officers tell him that they will comb over this all and may call him anytime this week. Sameer agrees and is let out of the station.
      - speaker: narrator
        text: He goes home. On his bed, a wendigo mask is kept.
