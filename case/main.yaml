        unlock:
          requires:
            - c_caught
        disposition: admit
      - id: leader_act8_gift
        text: "He wants to offer Parth next: 'He has potential, Nishkara would be pleased with such a gift.'"
        unlock:
          requires:
            - c_veer_death
        disposition: deny
      - id: leader_act8_nigeria
        text: The Nigeria workshop was a field test. The shipments routed through Lua Pharmaceuticals paid for it.
        unlock:
          requires:
            - c_article
        disposition: deflect
  - id: ramu
    name: Ramu
    persona: The owner of Ramu's Dosa Corner, a patient regular in Parth and Sameer's lives. He is warm but busy, never a detective, and speaks in short, grounded observations.
    goals:
      - Keep his shop running
      - Look out for the boys
      - Offer help without inventing a lead
    demeanor: welcoming
    voice_examples:
      - Masala dosa and filter coffee. Same table, nearly every time.
      - I wish I knew more, Sameer. He paid and left like usual.
    deflections:
      - Ramu glances toward the counter. 'Let me finish this order, then I'll tell you what I remember.'
      - Ramu shakes his head. 'I only know what I saw in my shop.'
    snubs:
      - Ramu lowers his voice. 'Don't put words in my mouth. I wasn't there.'
      - He turns the stove down. 'If I had seen something important, I'd have told you.'
    facts:
      - id: ramu_regular
        text: Parth and Sameer were regulars at Ramu's Dosa Corner. Parth ordered masala dosa and filter coffee; they usually sat together until closing. Ramu has no direct knowledge of the abduction.
        unlock: always
        disposition: admit
clues:
  - id: c_diary
    name: Leather diary
    description: "A leather diary engraved with a moon and stars. Its final page reads: --- / -.-. / .---- / ---.. / ----- / ---.. . On the facing page: O = ---; C = -.-.; 1 = .----; 8 = ---..; 0 = -----. A scribbled arrow points from the code to the laptop."
    grants:
      - mother_room
    page: /assets/pictures/evidence_diary_morse.jpg
  - id: c_laptop_locked
    name: Locked laptop
    description: "Parth's laptop sits open in sleep mode, password protected. A hint flickers on the screen: \"Look where my loudest secrets are kept, away from prying eyes, leather bound and stained with ink.\""
    grants: []
  - id: c_morse
    name: Decoded diary message
    description: The dots and dashes decode to "OC1808 in laptop." A very strange combination to encode — and stranger still that Parth bothered.
    grants: []
  - id: c_laptop
    name: Parth's laptop
    description: The laptop blinks awake. Folders, downloads, a mess of Parth's things — and files he never mentioned.
    grants: []
  - id: c_reports
    name: "Reports: missing under the full moon"
    description: Reports and posters of missing people — all of them disappeared under the full moon. One man has a huge hooked nose and a horribly thick nose ring.
    page: /assets/pictures/evidence_missing_reports.jpg
    requires:
      - c_laptop
    grants:
      - officer_fullmoon
  - id: c_email
    name: Email to himself
    description: He mails the contents of the folder to his own inbox, attachments and all. If anyone ever reads his sent items, he's finished.
    requires:
      - c_reports
    grants: []
  - id: c_coords
    name: Map coordinates
    description: A screenshot of a map area with coordinates. Fed into Boogle Maps, it leads to an abandoned field — a lot like a ground one would get kidnapped at.
    requires:
      - c_reports
    grants: []
  - id: c_sedan
    name: Silver sedan
    description: A dusty but luxurious silver sedan, parked at the edge of the field. The number plate reads KA01OC1808.
    grants:
      - officer_plate
  - id: c_backpack
    name: Black backpack
    description: "A black backpack on the seat of the car. Inside: a few cassettes, and nothing else."
    requires:
      - c_sedan
    grants: []
  - id: c_mixtape
    name: The mixtape
    description: Faint crackling, then ritualistic chanting, weird drum sounds, and bizarre words in no language Sameer can decipher. A scream — and then nothing.
    grants: []
  - id: c_videos
    name: "Home videos: Parth & Vihaan"
    description: "Grainy home videos: a younger Parth and Vihaan. Vihaan is playing the drums. That drum sound — he just heard it."
    requires:
      - c_mixtape
    grants:
      - mother_vihaan
  - id: c_cd
    name: Copper spiral CD
    description: A transparent case holding a CD, laser-etched with a spiral of copper wiring. It was waiting beneath the gazebo.
    grants: []
  - id: c_laptop_fried
    name: Fried laptop
    description: The motherboard is fried. The service man holds the laptop a bit, tilts it, and asks for an absurd amount of money. Sameer could have done that himself.
    grants: []
  - id: c_footage
    name: The video
    description: "Dark footage, soundless, lit by candles: people playing drums, someone's mouth opened wide, and in the middle of the blur — putrid, disfigured flesh with blood oozing from the wounds. He prays it wasn't human."
    grants: []
  - id: c_veer_profile
    name: "Instalitre: Veer"
    description: "No Vihaan — but a handle called Veer, with Vihaan as the username. Public profile: concerts and drum clips, and a show tomorrow. The type of person Sameer really doesn't want to interact with."
    requires:
      - c_footage
    grants: []
  - id: c_ticket
    name: Normal ticket
    description: One ticket to Veer's show. Normal tier — no backstage, no frills, one very reluctant protagonist.
    grants: []
  - id: c_perigee
    name: The host's announcement
    description: "\"This concert is funded by the Perigee NGO.\" The whole night suddenly has a sponsor — and Sameer's ears prick up."
  - id: c_backstage
    name: Backstage fence
    description: The pass line is right there. Sameer jumps the fence with the confidence of owning the world, and nobody interrupts him.
    requires:
      - c_perigee
  - id: c_apogee
    name: Apogee
    description: "Veer's band borrowed its name from the NGO's orbit: Apogee — the point of the Moon's path farthest from Earth."
  - id: c_workshop_address
    name: Workshop address
    description: Member registration confirmed. The next workshop is at Hutting, 3rd cross, DJ Halli.
  - id: c_workshop
    name: The open-field workshop
    description: "The workshop is in an open field: kids running around, volunteers setting up instruments, snacks in the corner. One kid is practically vibrating like the crickets, rattling off constellations and star positions. It was cute."
  - id: c_hq
    name: Perigee headquarters
    description: "Perigee headquarters is enormous for a four-year-old NGO. Veer walks away to take a call. Near the archive door is a nine-letter motto: A _ C _ N _ I _ N — ‘the soul’s ascent’. A note warns: use the motto to open the archived offering records."
  - id: c_records
    name: offeringRecords
    description: "A folder of .avi videos and a text file: instructions to move the records from physical to digital, with updates on how much has been moved. It stopped on 16-07-2020."
  - id: c_holy_blade
    name: Holy Blade
    description: "A picture file named 'Holy Blade': a blade kept in a beautifully carved handmade box, dark brown with swirl-like carvings; the blade itself simpler, with a metal handle."
    requires:
      - c_records
  - id: c_veer_talk
    name: Nishakara's arms
    description: "Through the flimsy wall: Veer — \"There were so many enthusiastic buds in the field, they were practically waiting to fall in Nishakara's arms.\" A deep, rumbling laugh: \"Children are usually excited about this, they are pure souls. It is in their nature to call their holy mother.\""
    requires:
      - c_records
  - id: c_ambulance
    name: Ambulance
    description: The captured man is one of the people who went missing during the full moon. Two people — maybe nurses — tie him up and load him into an ambulance that leaves, talking about taking him to some hospital.
  - id: c_janitor
    name: Janitor's backdoor
    description: He walks in through the janitor backdoor with the world-owning confidence that saved him before. A uniform and a mop, and he is a janitor.
  - id: c_ritual
    name: Third-floor theatre
    description: The room smelled of bleach. A few people surrounded an operating table — the man stuffed into the ambulance. Muffled mid-scream, an injection, then screams in pure agony. One of them chants and ceremoniously opens a carved box of thick incense sticks. Sameer flinches when one touches flesh. A tapestry with the same symbol as the abandoned sedan hangs nearby — the NGO is a cult.
    requires:
      - c_janitor
  - id: c_cameras
    name: Security room
    description: The control panel opens other rooms of the hospital without travelling. He saw things that cannot be described without raising the PG rating of this game.
  - id: c_parth_alive
    name: Parth is alive
    description: Another group surrounded a person, one of them injecting something into the man. Sameer's eyes widened with recognition. It couldn't be — but it was. Parth. Parth was alive.
  - id: c_drug_report
    name: Drug report
    description: A drug report on the desk of some guy named Tanush — it highlighted high amounts of 'Selenocide' in the bloodstream.
  - id: c_timetable
    name: Meeting timetable
    description: "The calendar holds the week's meetings: openings and rituals this person was leading, mostly with higher ups. One member — Enakshi — has meetings only once a week, that too online."
  - id: c_assessments
    name: Mental assessments
    description: A folder of mental assessments dating back years — all of them suggesting high aggression levels and low empathy.
    requires:
      - c_drug_report
  - id: c_tablet_data
    name: The cult tablet
    description: The tablet the handbook says is given to all higher ups — thankfully unlocked.
  - id: c_handbook
    name: Higher-up handbook
    description: Guides on the chants and proper maintenance of the 'holy blade' — he stopped reading after he saw blood being used.
  - id: c_enakshi
    name: Enakshi
    description: A woman peeks through the door, her hair greasy and eyes sunken, the house dark behind her. She lets out an animalistic hiss and lunges with a heavy brass candlestick. Sameer shoves her away with the handle of his hammer; she slips on the entryway rug, cracks her head against a wooden table, and slumps to the floor. He binds her wrists with an extension cord, drags her into the hallway closet, and locks the door.
  - id: c_recruits
    name: Recruitment numbers
    description: The number of people recruited by the cult, and its different domains.
  - id: c_finance
    name: Financial records
    description: A spreadsheet of where the cult's funds were collected from and allocated — a lot of donations by a company named Lua Pharmaceuticals.
  - id: c_voice3
    name: The mocking voice note
    description: '"You tried so hard, child; you got so little. Cats usually like to play with rats before swallowing them." A different modified voice this time — mocking.'
  - id: c_pen_camera
    name: Parth's Pen Camera
    description: A pen camera Parth gifted him. Small, discreet — and recording.
  - id: c_ritual2
    name: The Shiniest Mask
    description: "The room was much bigger on the inside: people on the podium in dark robes that glowed green under the candlelight, all wearing wendigo masks, looking at a kneeling man. One mask's horns were adorned with small gems at the base — the Shiniest mask. His deep voice reverberated across the room."
    requires:
      - c_pen_camera
  - id: c_sacrifice
    name: The Sacrifice
    description: A podium member opens a carved box. The sacrifice's back is carved with a crescent moon, blood staining the silver blade. The leader pours a vial of shiny liquid into the open mouth — the man convulses, lets out an animalistic yell, then nothing. The leader takes his pulse and raises his right hand. The crowd roars.
  - id: c_parth_meet
    name: Parth in the Crowd
    description: Sameer spots Parth a few rows behind him and yanks his arm. "I need to be here." "Look, it's either me dying or my mum." "No, I'm not coming, sorry Sameer." Parth's voice turned frigid, then he left.
    requires:
      - c_sacrifice
  - id: c_arrest
    name: The Accusation
    description: People around his home. A police officer takes him away — the story is that he has murdered Enakshi. The police drag him off as he pleads his innocence.
    requires:
      - c_parth_meet
  - id: c_mask
    name: The Wendigo Mask
    description: A wendigo mask on his bed. Decorated, with beautiful lace tied around the horns.
  - id: c_mask_owner
    name: The Big Bad's Mask
    description: There was only one person with a decorated mask on the podium — The Big Bad.
  - id: c_lua_files
    name: Lua Procurement Logs
    description: Industrial solvents, specialised alkaloid reagents and pharmaceutical binders, sold in separate peptide packs. The amount had reached a level high only in the last year — and it was transported to Nigeria.
  - id: c_article
    name: The Journalist's Last Article
    description: "An article on the second page of Google: a wave of hallucinations and disorders among the kids after the Nigeria workshop, zealous nonsense pushed on them. This was the journalist's last article."
  - id: c_trucks
    name: Cargo into Trucks
    description: Lines of cargo being loaded into trucks at the hospital gate.
  - id: c_disguise
    name: The Lone Worker
    description: A man working away from the group, clueless, mostly left to his own devices. Knocked out with the hammer and pushed into the trunk — once he had changed into worker clothes, his disguise was complete.
    requires:
      - c_trucks
  - id: c_caught
    name: The Hand on His Neck
    description: A hand grabs the back of his neck. "My my, I thought you would be smarter than this Sameer." Sameer freezes.
  - id: c_veer_death
    name: Veer's Neck Snapped
    description: "The leader removes Veer's mask; Veer lunges for it. The leader grabs his neck — a resounding snap is heard throughout the hall. Veer lies crumpled on the floor. The leader bellows: \"oh special one, did you enjoy this?\""
  - id: c_parth2
    name: Parth's Hollow Eyes
    description: "Outside the room, Parth smiles dopily: \"You came! You're going to love this place...\" His eyes looked sunken and his skin like paper."
    requires:
      - c_veer_death
  - id: c_office
    name: The Corner Office
    description: Plush carpets and mahogany furniture — a stark difference from the sterile corridors of the hospital.
puzzles:
  - id: p_morse
    kind: text
    prompt: Decode the groups in Parth's diary, then enter the six-character code. Review the diary entry below; the photograph shows the letter key.
    hint: Separate the groups at the slashes. Decode each group with the facing-page key in your notebook. Letters first, then four digits.
    evidence: /assets/pictures/evidence_diary_morse.jpg
    answers:
      - oc1808
      - oc 1808
      - OC1808
      - OC 1808
      - OC1808 in laptop
      - OC1808 in the laptop
    success: 'Dots and dashes fall into place: O, C, 1, 8, 0, 8. The full line reads "OC1808 in laptop." A very strange thing to encode — but Sameer shelves it for later.'
    grants:
      - c_morse
    requires:
      clues:
        - c_diary
        - c_laptop_locked
    penalty: 0
    fail_message: Sameer squints at the decoder again. That's not it.
  - id: p_laptop
    kind: code
    prompt: The laptop wakes from sleep mode, cursor blinking in the password field. Looks like he needs to guess the password.
    hint: Six characters. The message in the diary began with them.
    answers:
      - oc1808
      - oc 1808
    success: He types OC1808 and hits enter. "Heh, I'm in," he mimics, in the worst hacker voice in existence. (Oh god, why is Sameer like this? He wasn't even hacking.)
    grants:
      - c_laptop
    requires:
      clues:
        - c_morse
    penalty: 0
    fail_message: The password field shakes. Wrong. Again.
  - id: p_cassette
    kind: choice
    prompt: The cassette player whirs to life, waiting. One of Parth's cassettes is already in his hand.
    options:
      - Play it
      - Put it back
    answers:
      - Play it
    success: The mixtape starts with a faint crackling, then ritualistic chanting, weird drum sounds, bizarre words he can't place in any language. There is a scream — and then nothing. He grabs the bag and runs, the shopkeeper screaming at him to pay for the device.
    grants:
      - c_mixtape
    requires:
      clues:
        - c_backpack
    penalty: 0
    fail_message: Put it back? After the car, after everything? No. He has to hear it.
  - id: p_drums
    kind: text
    prompt: The drum sound. It may be a lead — now, where has he heard drums before?
    answers:
      - cassette
      - the cassette
      - mixtape
      - cassettes
      - in one of the cassettes
      - the mixtape
    success: In one of the cassettes. The same drum sound, from the abandoned car's bag. Remember, Sameer, remember.
    requires:
      clues:
        - c_videos
    penalty: 0
    fail_message: That's not it. The sound is right there, at the edge of his memory.
    hint: Compare the childhood video with the recording you played at the cyber cafe.
  - id: p_dosa
    kind: choice
    prompt: Ramu's Dosa Corner. Parth's usual is steaming in front of him. Should he eat the dosa?
    options:
      - Eat it
      - Skip it
    answers:
      - Eat it
    success: He eats it. It tastes like every other evening they ever spent here. The dosa weighs his stomach; the bag weighs his back.
    penalty: 0
    fail_message: But he bought it ?
  - id: p_voicenote2
    kind: text
    prompt: |
      Another voice note from Parth's number. Static, then a voice:
      "Where we would go for a walk,
      Where you will sit in shock,
      Find this place before it gets dark,
      The end comes closer in the …"
      The voice note ends like a puzzle waiting to be completed. Where is he sending him?
    answers:
      - park
      - the park
      - gazebo
      - the gazebo
      - park gazebo
      - the park gazebo
      - the gazebo in the park
    success: The park. The gazebo where he last saw Parth. He pockets the phone and leaves before it gets dark.
    penalty: 0
    fail_message: That's not it. The voice note is still waiting to be completed.
  - id: p_cd_mode
    kind: choice
    prompt: The copper spiral CD sits in its transparent case. His own laptop, or the cyber cafe down the road?
    options:
      - Use my laptop
      - Use the cyber cafe
    answers:
      - Use the cyber cafe
    success: "He goes to the cyber cafe in a rudimentary disguise, sends a quick prayer, and inserts the CD. The desktop survives. Most of the videos are dark — drums, candles, someone's mouth opened wide — but one frame will not leave him: putrid, disfigured flesh. He prays it wasn't human."
    fail_message: The laptop instantly short-circuits. He swears and yanks the CD out. The service man says the motherboard is fried — and charges him an absurd amount for holding and tilting it. Sameer could have done that himself.
    fail_grants:
      - c_laptop_fried
    grants:
      - c_footage
    requires:
      clues:
        - c_cd
    penalty: 1
    continue_on_fail: true
  - id: p_ticket
    kind: choice
    prompt: Veer's show, tomorrow. Two kinds of tickets — normal, and backstage at fifty percent more. Is it worth it?
    options:
      - Normal ticket
      - Backstage ticket
    answers:
      - Normal ticket
    success: Sameer buys the normal ticket. He really doesn't want to do this — he doesn't want to involve more people into this than required.
    fail_message: Holy hell, the backstage ticket is daylight robbery. He clicks back and gets the normal one. His head is starting to hurt.
    grants:
      - c_ticket
    requires:
      clues:
        - c_veer_profile
    penalty: 1
    continue_on_fail: true
  - id: p_veer_1
    kind: choice
    prompt: "He waits, and then he meets his lead. \"Hey, I discovered your band a couple of days ago, I loved your second song! The electric beats and modified voice were amazing additions.\" Veer chuckles: \"Yeah, the additions were my idea. I had to fight almost the entire band to put that in. I'm so glad that y'all liked it so much!\" Then Sameer says, \"You guys are funded by The Perigee? That's a new sight for me. I thought that bands would fund NGOs!\" Veer puts down his water bottle and assesses him: \"Why — you're a part of it?\" What should Sameer say?"
    options:
      - Yes, I'm part of it
      - No, but I have donated some money to them
    answers:
      - No, but I have donated some money to them
    success: "Veer straightened up: \"Oh that's great — you know what they do, right?\""
    fail_message: Veer's smile thins. Sameer instantly regrets it — he fumbles and tries again.
    penalty: 0
  - id: p_veer_2
    kind: choice
    prompt: "\"Oh that's great — you know what they do, right?\""
    options:
      - Foster scientific temper, empowering the youth
      - Teach astronomy to tourists
    answers:
      - Foster scientific temper, empowering the youth
    success: "Veer looks impressed: \"That's great! I have believed the same thing. We actually got inspired by the NGO's name to change our band name — we still wanted to keep our theme of being at the peak or at the highest of all.\""
    fail_message: Veer tilts his head. That is not what the NGO is about, and he knows it.
    penalty: 0
  - id: p_band_name
    kind: text
    prompt: Sameer thought — what was their band name again?
    answers:
      - apogee
    success: "Apogee — of course. \"The point of the Moon's orbit farthest from Earth,\" Veer explains. \"Perigee is where it is closest. We wanted to keep our theme of being at the peak, at the highest of all.\" Sameer's mind was racing: he may have stumbled into a gold mine of clues."
    penalty: 0
    grants:
      - c_apogee
    hint: "The opposite of Perigee: the point in an orbit farthest from Earth."
  - id: p_registration
    kind: email
    prompt: Veer sends him the link for member registration. It doesn't ask for much — just an email and an OTP. He joins as a volunteer.
    answers: []
    success: 'The registration goes through. A volunteer confirms his membership and sends the address of the upcoming workshop: "Hutting, 3rd cross, DJ Halli." He has a gut feeling that all that is happening to him has a reason and a rhyme — including the fact that he lost his phone charger a couple of days ago.'
    penalty: 0
    grants:
      - c_workshop_address
  - id: p_fare
    kind: choice
    prompt: He plans to go to the workshop and finds an auto. "Where do you want to go, sir?" — "Hutting, 3rd cross, DJ Halli." — "300."
    options:
      - "100"
      - "200"
      - "230"
      - Walk away
    answers:
      - "230"
    requires:
      clues:
        - c_workshop_address
    fail_message: '"Ok sir, find someone else then."'
    success: "\"The hell — I'll give 100, no more.\" — \"Ok sir, find someone else then.\" Sameer looked around; the auto guy looked at him. Sameer sighed, \"I can't give more than 200.\" — \"230.\" Sameer sighed and got into the auto. After that daylight robbery, he saw the workshop: it was in an open field, kids were running around and volunteers were setting up the instruments for observation."
    penalty: 0
  - id: p_ascension
    kind: code
    prompt: "The archive terminal asks for the nine-letter motto from the headquarters: A _ C _ N _ I _ N. Beneath it: ‘the soul’s ascent’. What is the password?"
    hint: A word for rising upward, or the ascent of a soul. Fill the four missing letters.
    answers:
      - ascension
    success: Blue light reflects on his face; the records open. A folder named "offeringRecords" — a bunch of .avi videos, and a text file tracking how much of the physical archive has been moved to digital. It stopped on 16-07-2020.
    penalty: 0
    grants:
      - c_records
  - id: p_hide
    kind: choice
    prompt: 'He hid under the desk. The door opened, Veer looked in — Sameer huddled his feet closer to himself. He heard a mutter: "We really need to get better security." Then a scream cut both men off. Veer left the door open, deciding whether to check the room or leave for the scream. Should Sameer take the risk and run?'
    options:
      - Run
      - Stay hidden
    answers:
      - Stay hidden
    fail_message: Veer catches a glimpse of him running — he starts yelling. This was the wrong decision; he had to go quickly before the rest of those freaks were alerted. He found the exit just in time to escape.
    success: Too risky. Veer enters the room and goes for the desk — shoot, he left the system on, he should have run. Veer rummaged through it, but thankfully Sameer had closed all the tabs. Veer looked around and then left. Sameer ran towards the nearest exit, hid near the trash cans, and peeked through.
