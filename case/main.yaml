        disposition: deflect
  - id: leader
    name: The Leader
    persona: The cult's leader and self-styled prophet of the Moon Goddess. Theatrical, mocking and utterly certain of his divinity — he treats the hunt for Sameer as a game.
    goals:
      - Return the chosen to Nishakara's arms
      - Grow the family
      - Offer the purest to Nishakara
      - Grow the cult, especially among children
      - Keep playing his game with Sameer
    demeanor: mocking
    deflections:
      - The leader laughs, low and rumbling, even though nothing was funny.
      - The leader raises a hand, as if blessing you.
      - The leader chuckles, low and unhurried. "You are asking the wrong questions, child."
      - The leader spreads his arms as if addressing a congregation. "Everything I do, I do for her."
    snubs:
      - The leader turns his back and opens a door. "The goddess is waiting."
      - The leader tilts his masked face. "You bore me, child."
      - The leader looks through you. "The monkeys always bark the same."
      - The leader hums a chant, unbothered, until you stop.
    facts:
      - id: leader_voice
        text: "The voice notes are his: warped through a modulator, deep and mocking, making fun of Sameer's distress."
        unlock: always
        disposition: admit
      - id: leader_nishakara
        text: He calls the Moon Goddess Nishakara the cult's holy mother. The chosen are 'returned to her arms' — he means it as an honour.
        unlock: always
        disposition: admit
      - id: leader_mask
        text: On the podium he wears the Shiniest wendigo mask — gold trim on the robes, gems at the base of the horns.
        unlock:
