    objective: Decode the diary, unlock the laptop, then collect the reports, email and coordinates.
    intro:
      - speaker: narrator
        text: Sameer goes to Parth's home. He meets Parth's mother — she looks as if she hasn't slept at all since the day her son went missing. She still smiles at him, with a lot of effort.
      - speaker: sameer
        text: I would like to go to Parth's room, aunty.
      - speaker: narrator
        text: His mum looks up the stairs with unshed tears, looks at Sameer, then allows him.
      - speaker: mother
        text: Please don't disturb anything in his room. Parth may have a hard time finding stuff once he comes back.
      - speaker: narrator
        text: Sameer runs up the stairs.
    outro:
      - speaker: narrator
        text: He puts the coordinates into Boogle Maps. It leads to an abandoned field — not that far from Parth's home.
      - speaker: sameer
        text: Looks a lot like a ground one would get kidnapped at.
      - speaker: narrator
        text: Thankfully, our lovely protagonist had never attended stranger danger sessions. So he went there.
