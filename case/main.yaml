    objective: The mask is on your face now. See the revelation through to its end.
    intro:
      - speaker: narrator
        text: Sameer looked around — the noises were too loud. He started yelling nonsense; he couldn't hear himself. It was getting humid. Colours bombarded him, the leader's voice the only thing to focus on. It was as if he was stoking the flame of barbarism in the room.
      - speaker: narrator
        text: He went towards the podium, towards his thread of sanity. Up front, he saw Veer go to the stage. The leader gestured to him.
    outro:
      - speaker: narrator
        text: He reaches the end of the corridor. He climbs on the window frame. He gazes at the burning room — the leader's face melted, muscle fibers charred.
      - speaker: narrator
        text: The entire point of this ordeal was to find Parth, and though he found him, he was unable to save him.
      - speaker: narrator
        text: Sameer is found back in his room, waking up to a new day. The birds are chirping and the sun is shining. He looks panicked — how did he get here? He was at the hospital, right?
      - speaker: narrator
        text: "There is a ping on his phone. A new voice note: \"You're not needed anymore. Your work is done. Now disappear.\" Sameer looks at the screen in confusion. The screen goes dark all of a sudden."
