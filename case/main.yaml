  - id: act4
    type: interactive
    kicker: Act IV
    title: Shashdhar
    entry_room: sameer_room
    rooms:
      - sameer_room
      - hospital
    objective: Find the hospital the man from the ambulance was taken to.
    intro:
      - speaker: narrator
        text: He thinks about the hospital the man may be at. If there is torture taking place, it won't be a normal hospital — it would be some sort of abandoned or isolated one. He tries to search for extremely old or isolated hospitals.
      - speaker: narrator
        text: He drives to Shashdhar Hospital, out on the outskirts of the city. He walks in through the janitor backdoor with the world-owning confidence that saved him before, and grabs a uniform and a mop to pose as a janitor.
    outro:
      - speaker: narrator
        text: Parth was alive.
      - speaker: narrator
        text: Sameer wanted to dance, he wanted to scream; he honestly felt a wave of numbness go over him. He was panicking so much — and all for naught. Parth was alive; maybe starving, but still healthy. He wasn't covered with bruises and burns. That was more than enough.
