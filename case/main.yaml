    objective: Search Parth's room, follow the coordinates to the field, then trace the cassettes and Vihaan.
    intro:
      - speaker: narrator
        text: Sameer goes to Parth's home. He meets Parth's mother — she looks as if she hasn't slept at all since the day her son went missing. She still smiles at him, with a lot of effort.
      - speaker: narrator
        text: Small talk first — the neighbours, the tea, the rain — while a rock sits in his throat the whole time.
      - speaker: sameer
        text: I would like to go to Parth's room, aunty.
      - speaker: narrator
        text: His mum looks up the stairs with unshed tears, looks at Sameer, then allows him.
      - speaker: mother
        text: Please don't disturb anything in his room. Parth may have a hard time finding stuff once he comes back.
      - speaker: narrator
        text: Sameer runs up the stairs.
      - speaker: narrator
        text: He finds himself in Parth's room. He sits on the unmade bed and looks around — his gaze falls on the laptop, sitting open in sleep mode.
    outro:
      - speaker: narrator
        text: He looked through every video of Parth and Vihaan but found nothing else. With a resigned look he bid farewell to Parth's mother and left.
      - speaker: sameer
        text: I'll find you, man. I promise.
