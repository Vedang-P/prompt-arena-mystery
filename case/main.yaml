        unlock:
          requires:
            - c_perigee
        disposition: admit
      - id: veer_act7_band
        text: He fought almost the entire band to keep the modified voices and electric beats.
        unlock: always
        disposition: admit
      - id: veer_act7_ngo
        text: He's been in touch with the NGO for at least three years. They usually hold workshops every Saturday.
        unlock:
          requires:
            - c_apogee
        disposition: admit
      - id: veer_act7_frazzled
        text: He came to Sameer's door frazzled, scared and angry — his name is in the folders Sameer sent to the police.
        unlock:
