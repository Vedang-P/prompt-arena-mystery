  - id: act7
    type: interactive
    kicker: Act VII
    title: The Mask
    entry_room: sameer_room
    rooms:
      - sameer_room
      - hospital
      - enakshi_house
    objective: The cult left its mask on your bed. Find out how they follow people — then decide.
    intro:
      - speaker: narrator
        text: The mask is decorated too, with beautiful lace tied around the horns. Why was it here, how was it here? Was it the police? Did he do the wrong thing by taking all the evidence to the police?
      - speaker: narrator
        text: Before he could fall into a spiral, he hears the door knock. Sameer peeked through — it was Veer. He looked unarmed, but Sameer kept his trusty hammer with him. He opened the door.
      - speaker: veer
        text: How the hell did you know about us? You couldn't keep your nose from sniffing about.
      - speaker: narrator
        text: Sameer saw for the first time how pathetic Veer looked.
      - speaker: sameer
        text: What are you talking about?
      - speaker: veer
        text: I'm hearing from my dad that you apparently got folders full of information. I swear to god, if my name comes in the cult, I will —
      - speaker: narrator
        text: Someone walks in hearing distance. Sameer looks at the guy, then back at Veer. He could get something from him right now.
    outro:
      - speaker: narrator
        text: The volunteers had mentioned a huge workshop today — he needs to stop it. If not to save himself or Parth, then to save the children.
      - speaker: narrator
        text: He thinks of contacting the police. The mask stares at him. He drops his phone and picks up the mask. He needs to do it himself.
      - speaker: narrator
        text: He reaches the hospital. Lines of cargo are being put into trucks.
    complete:
      clues: []
      puzzles:
        - p_floor
        - p_mask_owner
        - p_veer_mask
        - p_lua
        - p_nigeria
        - p_continue
  - id: act8
    type: interactive
    kicker: Act VIII
    title: The Revelation
    entry_room: hospital
    rooms:
      - hospital
      - tanush_office
    objective: The mask is on your face now. See the revelation through to its end.
    intro:
      - speaker: narrator
        text: He reaches the room where the sacrifice happened the last time. Just as he was about to shuffle into a corner to peek at the proceedings, a hand grabs the back of his neck. Sameer freezes. He doesn't dare turn.
      - speaker: leader
        text: My my, I thought you would be smarter than this Sameer.
      - speaker: narrator
        text: The deep voice chuckled behind him, even though there was no joke. He felt the temperature around him drop, his heartbeat steadily rising. The person didn't remove his hand, he just fixed his grip.
      - speaker: leader
        text: What, don't recognise me?
      - speaker: leader
        text: What are you doing in such shabby clothes, my boy. This is worse than the time you dressed up as a janitor. You should really try to match the dresscode. I even got you a special ribbon.
      - speaker: narrator
        text: The leader grabs the mask from Sameer's bag. He puts it on Sameer and pushes him into the room. Identical masks turn towards him. He takes a seat near the back, the leader closes the door and walks towards the podium.
      - speaker: leader
        text: I was naive at the start, like we all are. I didn't know nor was taught about our holy mother. She was always protecting us. Forget respecting — the lower monkeys didn't even look at her.
      - speaker: leader
        text: I had been at a very low point in my life, taking all sorts of things. I saw her — she cried, asking me why I was destroying myself. What did she do wrong?
      - speaker: leader
        text: Friends, I had seen divinity. The Moon Goddess had begged me to stop. Who am I but a humble mortal to follow her?
    outro:
      - speaker: narrator
        text: He reaches the end of the corridor. He climbs on the window frame. He gazes at the burning room — the leader's face melted, muscle fibers charred.
      - speaker: narrator
        text: The game has ended. Sameer can leave — before it restarts, he can go back to his life. Sameer closes his eyes, he breathes.
      - speaker: narrator
        text: His phone pings. What? The story is supposed to end. It's another voice note.
      - speaker: voice
        text: now disappear
      - speaker: narrator
        text: He plummets down to the ground.
    complete:
      clues:
        - c_office
      puzzles:
        - p_why
        - p_where
        - p_wrong
        - p_refer
        - p_spiral
        - p_years
        - p_rooms
