    fail_message: If you refuse, you are blocked from the game. Getting back in the game would cause a huge penalty.
    success: He is going to put his life in danger if he delves deeper, but he has to. The police are nearly incompetent and apparently children are being captured too. He needs to expose them, or bring light to this, or something. He has to.
