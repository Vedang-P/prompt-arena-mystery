  - id: act2
    type: interactive
    kicker: Act II
    title: Full Moon
    entry_room: sameer_room
    rooms:
      - sameer_room
      - gazebo
      - cyber_cafe
    objective: Chase the park CD, watch the videos, and find out who Veer is.
    intro:
      - speaker: narrator
        text: He felt sick — Parth had a whole life he was only finding out about, one abandoned car's mixtape at a time. He tries to ignore the teeny tiny piece of horribly sickening revelation at the back of his mind — he does this by going to the store to find something to eat.
      - speaker: narrator
        text: He is bombarded at the entrance by someone from a non-profit organisation. One can figure out if a person is from an NGO by a smile that stretches across their face but there is no crinkle near the eye. He tried ignoring, but another person stepped in front of him, the same stretched smile spooking him. He stopped and tiredly signalled them to tell him what they wanted.
      - speaker: narrator
        text: The one right in front of him pushed a pamphlet into his hands. It was apparently a worldwide NGO working towards the mission of fostering scientific temperament throughout the underprivileged youth — they were going to have a huge astronomy event in a few days. They had quite a few notable achievements, like the largest astronomy workshop organised in Nigeria just a year ago.
      - speaker: narrator
        text: He is impressed. He opens his wallet to give out 10 rupees. The worker at his side looks into his wallet; Sameer falls for their judgement and pulls out the 50 rupee note. He uses all his interview-larping skills to protect his last 30 rupees and makes a quick exit.
      - speaker: narrator
        text: He somehow reaches Ramu's Dosa Corner — Parth loved the place for some reason. He feels nostalgic and orders Parth's usual.
      - speaker: narrator
        text: He eats it and stumbles back home, the dosa weighing his stomach and the bag weighing his back. He crashes on his bed.
      - speaker: narrator
        text: When he wakes, the phone is showing 11:30 am. There was a new voice note from Parth.
    outro:
      - speaker: narrator
        text: Normal ticket. He really doesn't want to do this — he doesn't want to involve more people into this than required.
      - speaker: sameer
        text: This is either the lead of my life or the most expensive dead end ever.
      - speaker: narrator
        text: His head throbs — the usual marker to stop using his head for the day. He falls asleep.
    complete:
      puzzles:
        - p_voicenote2
        - p_dosa
        - p_ticket
      clues:
        - c_cd
        - c_footage
        - c_veer_profile
        - c_ticket
  - id: act3
    type: interactive
    kicker: Act III
    title: The Concert
    entry_room: concert
    rooms:
      - concert
      - workshop
      - ngo_hq
      - ngo_archive
      - sameer_room
    objective: Follow Veer and the Perigee NGO. Find out what Parth was doing there.
    intro:
      - speaker: narrator
        text: Sameer is in the concert. There is not much crowd, but the vibes are good — he wishes there was a water station around, or maybe food stalls. It's really just a temporary stage propped up; the lights are cool though.
      - speaker: narrator
        text: The band is a mix of industrial rock and electronic dance. They all have voice modifiers and rely on heavy synthesizers. He honestly enjoys the music — he should search it up later.
      - speaker: narrator
        text: "As the band closes, the host takes the mic: \"This concert is funded by the Perigee NGO.\" This makes Sameer's ears prick up. He needs to talk to Veer — or Vihaan, whoever this guy is. This may be the only lead he has to his friend."
      - speaker: narrator
        text: He looks around as the concert ends and spots a line for people with backstage passes. Now he just needs to go in.
    outro:
      - speaker: narrator
        text: Holy hell, the design was so cool. Then — a sound from the next room. He quickly closed the door and stayed as silent as possible. The volunteers would have left by now.
      - speaker: narrator
        text: The walls were flimsy. Through them, he heard Veer speak.
      - speaker: narrator
        text: "Through the flimsy wall: Veer — \"There were so many enthusiastic buds in the field, they were practically waiting to fall in Nishakara's arms.\""
      - speaker: narrator
        text: 'A deep, rumbling laugh answered him: "Children are usually excited about this. They are pure souls. It is in their nature to call their holy mother."'
      - speaker: narrator
        text: A shattering sound — as if a pot had been dropped. Silence for a few seconds; the only sound was Sameer's heartbeat. Then yelling, and screaming. Someone else was in the room, and he had been caught.
      - speaker: narrator
        text: 'The deep voice: "What were you trying to find, child?" A new voice, raspy and squeaky, like nails on a chalkboard: "I got lost, I wanted to go to the washroom." Veer: "With your phone recording the conversation?"'
      - speaker: narrator
        text: "\"You guys need to be stopped — you stole my child, you arses! I hope your face reflects your mind!\" The interrogator, amused: \"Well, there won't be much change then. I look rather handsome. Veer, why don't you go celebrate with the others. I want to talk to him — he looks like he has a story to tell.\""
      - speaker: narrator
        text: Veer sputtered, but left. Sameer heard the door swing. He hid under the desk.
    complete:
      clues:
        - c_records
        - c_holy_blade
        - c_veer_talk
        - c_plea
