  - id: act7
    type: interactive
    kicker: Act VII
    title: The Mask
    entry_room: sameer_room
    rooms:
      - sameer_room
      - hospital
      - enakshi_house
    objective: The cult left its mask on your bed. Find out how they follow people — then decide.
    intro:
      - speaker: narrator
        text: The mask is decorated too, with beautiful lace tied around the horns. Why was it here, how was it here? Was it the police? Did he do the wrong thing by taking all the evidence to the police?
      - speaker: narrator
        text: Before he could fall into a spiral, he hears the door knock. Sameer peeked through — it was Veer. He looked unarmed, but Sameer kept his trusty hammer with him. He opened the door.
      - speaker: veer
        text: How the hell did you know about us? You couldn't keep your nose from sniffing about.
      - speaker: narrator
        text: Sameer saw for the first time how pathetic Veer looked.
      - speaker: sameer
        text: What are you talking about?
      - speaker: veer
        text: I'm hearing from my dad that you apparently got folders full of information. I swear to god, if my name comes in the cult, I will —
      - speaker: narrator
        text: Someone walks in hearing distance. Sameer looks at the guy, then back at Veer. He could get something from him right now.
    outro:
      - speaker: narrator
        text: The leader grabbed the mask from Sameer's bag, put it on him and pushed him into the room. Identical masks turned towards him. He took a seat near the back; the leader closed the door and walked to the podium.
      - speaker: leader
        text: I was naive at the start, like we all are. I didn't know nor was taught about our holy mother. She was always protecting us. Forget respecting — the lower monkeys didn't even look at her.
      - speaker: leader
        text: I had been at a very low point in my life, taking all sorts of things. I saw her — she cried, asking me why I was destroying myself. What did she do wrong?
      - speaker: narrator
        text: The leader wiped his eyes; the people in front of him wailed. A low-lying fog released. Damn, this man was dramatic.
      - speaker: leader
        text: Friends, I had seen divinity. The Moon Goddess had begged me to stop. Who am I but a humble mortal to follow her? I had to share this revelation with everyone I could. People rejected — the worst was when I couldn't share it with the future, our children.
      - speaker: leader
        text: Shouldn't they have the right to know their holy mother?
      - speaker: narrator
        text: The crowd roared, then went animalistic — no different from a bunch of dogs barking. The smoke rose higher; the people were nothing more than their masks. Sameer felt numb.
    complete:
      clues: []
