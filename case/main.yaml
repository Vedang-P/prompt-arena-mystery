characters:
  - id: sameer
    name: Sameer
    persona: "The player character: anxious, sarcastic, painfully loyal to Parth. Talks to himself when he's scared, and he's scared a lot now."
    goals:
      - Find Parth
      - Make sense of the voice note
      - Follow every lead before it goes cold
    demeanor: anxious
    deflections:
      - Sameer drums his fingers on his thigh and changes the subject.
      - Sameer laughs too loudly. "Yeah. Anyway —"
    snubs:
      - Sameer stares. "Are we doing this or not?"
      - Sameer shakes his head. "That's not even a question."
    facts:
      - id: sameer_quest
        text: Parth has been missing for days. The voice note told him to look where Parth's thoughts rest.
        unlock: always
        disposition: admit
      - id: sameer_jade
        text: Jade Street ghosted him the day Parth vanished. He'd rather think about that than about the voice note.
        unlock: always
        disposition: admit
  - id: parth
    name: Parth
    persona: "The missing friend: charming, evasive, keeps secrets behind jokes. Anything he says is a clue."
    goals:
      - Keep his secrets
      - Protect Sameer from what he knows
    demeanor: charming
    deflections:
      - Parth laughs it off like it was a joke.
      - Parth shrugs. "It's nothing. You know me."
    snubs:
      - Parth's smile doesn't reach his eyes. "Drop it, man."
      - Parth suddenly finds his phone very interesting.
    facts:
      - id: parth_lie
        text: He said his mother called and he had to leave the gazebo early — but she never called. He told her Sameer had left early.
        unlock: always
        disposition: deny
      - id: parth_vihaan
        text: Vihaan was his childhood friend. The old home videos show the two of them together — Vihaan playing the drums.
        unlock:
          requires:
            - c_videos
        disposition: deflect
  - id: mother
    name: Parth's Mother
    persona: Grieving, hopeful, guilty about the last conversation. Measure every word — she is hiding something too.
    goals:
      - Get her son back
      - Not be blamed
    demeanor: guarded
    deflections:
      - Parth's mother looks up the stairs with unshed tears.
      - She wipes her hands on her saree and says nothing for a moment.
      - She folds her hands and looks past you, toward Parth's door.
      - "\"I've told you everything I know. Please — I can't do this again.\""
      - A kettle whistles somewhere in the house. She doesn't move to get it.
      - "\"Ask the police. That's what they're for, isn't it?\""
      - She straightens a photo frame that was already straight.
      - "\"He'll walk through that door. You'll see.\""
      - Her eyes fill, but her voice stays flat. "What else do you want from me?"
      - She looks at the clock, then at the window, then back at you.
      - "\"I'm sorry. I don't have the answers you're looking for.\""
      - She pulls her saree tighter around her shoulders and says nothing.
      - '"You were his friend. You should know him better than I do."'
      - She busies herself with the teacups, setting three out by habit.
      - '"Every knock on that door takes a year off my life."'
      - She glances at the stairs, as if Parth might come down them.
      - "\"I can't think straight. Ask me something else. Anything else.\""
      - The fan hums. She lets it fill the silence for a long moment.
      - '"People keep telling me to be strong. Strong for what?"'
      - She presses her palm against her forehead and exhales.
      - "\"If you find him, you'll tell me first. Promise me.\""
      - She turns away and starts arranging the shoes by the door.
    snubs:
      - Her voice cracks. "Parth will explain everything when he comes back."
      - She turns to the photo on the wall. "He's coming back."
    facts:
      - id: mother_alibi
        text: Parth left home about an hour before Sameer rang the doorbell. He told her he was going to meet Sameer at the park.
        unlock: always
        disposition: admit
      - id: mother_room
        text: She let Sameer search Parth's room and begged him not to disturb anything — Parth would have a hard time finding his things once he comes back.
        unlock:
          requires:
            - c_diary
        disposition: admit
      - id: mother_vihaan
        text: Vihaan was Parth's childhood friend. There are old home videos of the two of them — Vihaan on the drums.
        unlock:
          requires:
            - c_vihaan
        disposition: admit
  - id: officer
    name: Officer Rao
    persona: Cynical station officer, powered by masala dosa and procedure. Warms up if you bring him something real.
    goals:
      - Close the file with the least work possible
      - Not miss an actual crime under his nose
    demeanor: cooperative
    deflections:
      - The officer flips a greasy page and pretends not to hear.
      - The officer takes a slow bite of his masala dosa instead of answering.
      - Officer Rao taps his pen on the register and keeps reading.
      - "\"Write it in the complaint book and I'll look at it Monday.\""
      - He tears a corner off his dosa and chews, unbothered.
      - '"Bhai, we have forty cases and four constables."'
      - He flips a page with a greasy thumb.
      - "\"That's not how an investigation works. Ask me something useful.\""
      - He points the pen at the queue. Someone behind you clears their throat.
      - "\"Missing persons, missing persons. Everyone's missing someone.\""
      - He sighs, long and theatrical, and keeps writing.
      - '"Do you have evidence? No? Then I have paperwork."'
      - He stirs his tea with the back of his pen.
      - "\"Come back with a name, a date, and a document. Then we'll talk.\""
      - He glances at the wall clock and makes a small note of the time.
      - "\"Look, I'd love to help. I'd also love to go home.\""
      - He blows on his tea and takes a noisy sip.
      - "\"Ask the family. Nine times out of ten it's the family.\""
      - He slides a blank complaint form across the desk with one finger.
      - He rummages through a drawer that holds nothing but old pens.
      - '"Next." He looks past you at the line.'
      - Officer Rao wipes his fingers on a napkin and turns a page of the case file.
      - Officer Rao sighs. "These things take time, bhai."
    snubs:
      - The officer points his pen at the queue behind you. "Next."
      - The officer sighs. "Write it down and leave it on the desk."
      - Officer Rao raises his eyebrows. "That's all you have?"
      - Officer Rao goes back to his masala dosa.
    facts:
      - id: officer_rule
        text: The officer takes the report with no guarantee — 'He might be at someone else's home. Have you checked?' The station has forty cases and four constables.
        unlock: always
        disposition: admit
      - id: officer_fullmoon
        text: Every missing-person report in Parth's folder vanished under a full moon. The station stopped chasing that pattern years ago.
        unlock:
          requires:
            - c_reports
        disposition: deny
      - id: officer_plate
        text: The plate KA01OC1808 belongs to a Vihaan — the sedan was his. It's the only name attached to any of this.
        unlock:
          requires:
            - c_sedan
        disposition: admit
      - id: officer_act6_dosa
        text: He is having a masala dosa and flipping through cases with greasy fingers.
        unlock: always
        disposition: admit
      - id: officer_act6_pattern
        text: "The reports line up: missing people, gone posters, a full-moon calendar. The station filed the pattern away and forgot it."
        unlock:
          requires:
            - c_reports
        disposition: admit
      - id: officer_act6_charge
        text: Sameer is being held for the murder of Enakshi — the woman from the house across the lane.
        unlock:
          requires:
            - c_arrest
        disposition: admit
      - id: officer_act6_cases
        text: The dates in Sameer's files trace at least five missing cases to the same cult.
        unlock:
          requires:
            - c_arrest
        disposition: admit
      - id: officer_act6_mask
        text: No one at the station will admit to leaving a wendigo mask on Sameer's bed.
        unlock:
          requires:
            - c_mask
        disposition: deflect
  - id: veer
    name: Veer
    persona: Vihaan — the drummer who now goes by Veer. Charming, loud, thirsty for recognition, and wrapped up in the Perigee NGO's orbit. His band is Apogee. Friendly to fans, guarded about the NGO's inner workings.
    goals:
      - Keep the band clean of the NGO
      - Not think too hard about what Parth was doing
      - Keep the band funded and growing
      - Stay on the NGO's good side
      - Never ask too many questions himself
    demeanor: cooperative
    deflections:
      - Veer takes a long sip of water and looks at the stage.
      - Veer chuckles and steers the talk back to the band.
      - Veer adjusts the strap of his guitar and grins. "Ask the band. I just sing."
      - "\"Man, backstage stuff is the manager's thing, not mine.\""
      - He spins a drumstick between his fingers and shrugs.
      - "\"You should come to the next show. That's where the answers are — in the music.\""
      - '"Whoa, heavy question. Buy me a drink first."'
      - He laughs, but it doesn't reach his eyes.
      - "\"I'm just here to play, bro. Everything else is noise.\""
      - He waves at someone across the floor and loses interest in the question.
      - "\"That's above my pay grade, and I don't even get paid.\""
      - He taps the mic twice, checking something you can't hear.
      - '"You ask more questions than my label, and they pay me."'
      - He flips through a setlist that clearly hasn't changed in weeks.
      - '"I keep my head down and my amps up."'
      - He signals the sound guy. The monitors go quiet, then loud again.
      - '"Look, I talked to the cops already. Twice. Ask them."'
      - He takes a long pull of water and studies the ceiling.
      - "\"Maybe. Maybe not. That's basically the whole answer.\""
      - He shrugs and turns back to tuning a string that was already in tune.
      - "\"You're stressing me out before a show, man.\""
      - Veer laughs and takes another swig of water. "Man, that's a lot of questions for a fan."
      - Veer taps his monitor and shrugs. "I only play music, bro. The NGO people handle the rest."
    snubs:
      - Veer's grin fades. "I don't know what you mean, man."
      - Veer waves over a security guard with two fingers.
      - Veer looks past you at someone waving from the stage. "Yeah — cool, cool. Anyway..."
      - Veer's smile stays stretched. "You want a photo or something?"
    facts:
      - id: veer_band
        text: "He fronts the band: industrial rock and electronic dance, voice modifiers, heavy synthesizers. The voice additions were his idea."
        unlock: always
        disposition: admit
      - id: veer_parth
        text: Parth came around the day before yesterday — he was super interested in this stuff, and he was great with kids.
        unlock:
          requires:
            - c_ticket
            - c_apogee
        disposition: admit
      - id: veer_ngo
        text: He has been in touch with the Perigee NGO for at least 3 years; they usually have workshops every Saturday.
        unlock:
          requires:
            - c_apogee
        disposition: admit
      - id: veer_donation
        text: "The host made a mistake: the band donates a good portion of its revenue to Perigee, not the other way around."
        unlock:
          requires:
            - c_perigee
        disposition: admit
      - id: veer_act7_band
        text: He fought almost the entire band to keep the modified voices and electric beats.
        unlock: always
        disposition: admit
      - id: veer_act7_ngo
        text: He's been in touch with the NGO for at least three years. They usually hold workshops every Saturday.
        unlock:
          requires:
            - c_apogee
        disposition: admit
      - id: veer_act7_frazzled
        text: He came to Sameer's door frazzled, scared and angry — his name is in the folders Sameer sent to the police.
        unlock:
          requires:
            - c_mask
        disposition: deny
      - id: veer_act7_tailed
        text: He has heard of members being tailed around. Usually the aftermath is messy.
        unlock:
          requires:
            - c_mask_owner
        disposition: admit
      - id: veer_act7_step_down
        text: He pleads with Sameer to step down — it's not worth it — and begs him not to send the files, or his family will be targeted too.
        unlock:
          after:
            - veer_act7_tailed
        disposition: deflect
  - id: enakshi
    name: Enakshi
    persona: "A member of the organisation whose days blur together: greasy hair, sunken eyes, a house kept dark. She guards her hallway closet like a temple."
    goals:
      - Protect what the organisation gave her
      - Serve the holy mother
    demeanor: hostile
    deflections:
      - Enakshi hisses, low in her throat.
      - Enakshi glances at the closet door behind her.
    snubs:
      - Enakshi bares her teeth. "The goddess will judge you."
      - Enakshi starts to hum something tuneless and will not stop.
    facts:
      - id: enakshi_online
        text: She is a member of the organisation whose meetings happen only once a week, online. Her colleagues have never met her in person.
        unlock: always
        disposition: deny
      - id: enakshi_lunge
        text: She lunges at strangers with a brass candlestick. Her house is dark, and it isn't just the curtains.
        unlock:
          requires:
            - c_timetable
        disposition: admit
  - id: tanush
    name: Tanush
    persona: "The name on the corner office: polite, meticulous, terrifying. Rituals, meetings and openings all run through his desk. He calls the missing 'offerings' without blinking."
    goals:
      - Keep the organisation's records perfect
      - Stay indispensable to the leader
    demeanor: precise
    deflections:
      - Tanush straightens a paper that is already straight.
      - Tanush smiles at a point just past you.
    snubs:
      - Tanush checks his watch. "Is there a point to this?"
      - Tanush keeps writing. He does not look up.
    facts:
      - id: tanush_office
        text: His office is mahogany and plush carpet — a world apart from the sterile hospital corridors. The meetings, openings and rituals all run through him.
        unlock: always
        disposition: deny
      - id: tanush_selenocide
        text: A drug report on his desk shows high amounts of Selenocide in a patient's bloodstream.
        unlock:
          requires:
            - c_drug_report
        disposition: deflect
  - id: leader
    name: The Leader
    persona: The cult's leader and self-styled prophet of the Moon Goddess. Theatrical, mocking and utterly certain of his divinity — he treats the hunt for Sameer as a game.
    goals:
      - Return the chosen to Nishakara's arms
      - Grow the family
      - Offer the purest to Nishakara
      - Grow the cult, especially among children
      - Keep playing his game with Sameer
    demeanor: mocking
    deflections:
      - The leader laughs, low and rumbling, even though nothing was funny.
      - The leader raises a hand, as if blessing you.
      - The leader chuckles, low and unhurried. "You are asking the wrong questions, child."
      - The leader spreads his arms as if addressing a congregation. "Everything I do, I do for her."
    snubs:
      - The leader turns his back and opens a door. "The goddess is waiting."
      - The leader tilts his masked face. "You bore me, child."
      - The leader looks through you. "The monkeys always bark the same."
      - The leader hums a chant, unbothered, until you stop.
    facts:
      - id: leader_voice
        text: "The voice notes are his: warped through a modulator, deep and mocking, making fun of Sameer's distress."
        unlock: always
        disposition: admit
      - id: leader_nishakara
        text: He calls the Moon Goddess Nishakara the cult's holy mother. The chosen are 'returned to her arms' — he means it as an honour.
        unlock: always
        disposition: admit
      - id: leader_mask
        text: On the podium he wears the Shiniest wendigo mask — gold trim on the robes, gems at the base of the horns.
        unlock:
          requires:
            - c_ritual2
        disposition: deflect
      - id: leader_act8_voice
        text: It is his voice — the deep voice from the NGO headquarters, the one that ordered the torture of the missing man.
        unlock: always
        disposition: admit
      - id: leader_act8_ritual
        text: He calls the killings offerings. The Moon Goddess begged him to stop, and he chose to follow her instead.
        unlock:
          requires:
            - c_ritual2
        disposition: deny
      - id: leader_act8_game
        text: All of it was a game to him. He knew Sameer went through his office, and he let the hunt continue for fun.
        unlock:
          requires:
            - c_caught
        disposition: admit
      - id: leader_act8_gift
        text: "He wants to offer Parth next: 'He has potential, Nishkara would be pleased with such a gift.'"
        unlock:
          requires:
            - c_veer_death
        disposition: deny
      - id: leader_act8_nigeria
        text: The Nigeria workshop was a field test. The shipments routed through Lua Pharmaceuticals paid for it.
        unlock:
          requires:
            - c_article
        disposition: deflect
  - id: ramu
    name: Ramu
    persona: The owner of Ramu's Dosa Corner, a patient regular in Parth and Sameer's lives. He is warm but busy, never a detective, and speaks in short, grounded observations.
    goals:
      - Keep his shop running
      - Look out for the boys
      - Offer help without inventing a lead
    demeanor: welcoming
    voice_examples:
      - Masala dosa and filter coffee. Same table, nearly every time.
      - I wish I knew more, Sameer. He paid and left like usual.
    deflections:
      - Ramu glances toward the counter. 'Let me finish this order, then I'll tell you what I remember.'
      - Ramu shakes his head. 'I only know what I saw in my shop.'
      - Ramu slides a dosa onto a plate and calls out an order.
      - '"One minute, Sameer. Let me finish this."'
      - He wipes the counter in circles and shakes his head.
      - "\"I only know what I see in my shop, and I'm no detective.\""
      - The griddle sizzles. He turns back to it, leaving the question hanging.
      - '"Ask the boys who sit at the corner table. They saw more than me."'
      - '"Tea? No? You look like you need tea."'
      - He taps the menu board and moves on to the next order.
      - '"Every day, same questions. I wish I had answers."'
      - He counts change into a customer's palm before answering.
      - "\"I don't want trouble in my shop. You understand.\""
      - He glances at the door as someone new walks in.
      - "\"You're not eating. Sit down and eat something first.\""
      - '"Look at me. Do I look like I follow people around?"'
      - He turns the fan up a notch and wipes his forehead.
      - '"I told the police the same thing. Ask them what I said."'
      - He lifts the lid off a pot and lets out a long breath of steam.
      - "\"Maybe ask his mother. Mothers know things we don't.\""
      - "\"That's not a question for a dosa man, Sameer.\""
    snubs:
      - Ramu lowers his voice. 'Don't put words in my mouth. I wasn't there.'
      - He turns the stove down. 'If I had seen something important, I'd have told you.'
    facts:
      - id: ramu_regular
        text: Parth and Sameer were regulars at Ramu's Dosa Corner. Parth ordered masala dosa and filter coffee; they usually sat together until closing. Ramu has no direct knowledge of the abduction.
        unlock: always
        disposition: admit
clues:
  - id: c_diary
    name: Leather diary
    description: "A leather diary engraved with a moon and stars. Its final page reads: --- / -.-. / .---- / ---.. / ----- / ---.. . A scribbled arrow points from the code to the laptop."
    grants:
      - mother_room
    page: /assets/pictures/evidence_diary_morse.jpg
  - id: c_laptop_locked
    name: Locked laptop
    description: "Parth's laptop sits open in sleep mode, password protected. Sameer tries a guess — the field shakes. The screen offers a hint instead: \"Look where my loudest secrets are kept, away from prying eyes, leather bound and stained with ink.\""
    grants: []
  - id: c_morse
    name: Decoded diary message
    description: The dots and dashes decode to "OC1808 in laptop." A very strange combination to encode — and stranger still that Parth bothered.
    grants: []
  - id: c_laptop
    name: Parth's laptop
    description: The laptop blinks awake. Folders, downloads, a mess of Parth's things — and files he never mentioned.
    grants: []
  - id: c_reports
    name: "Reports: missing under the full moon"
    description: Reports and posters of missing people — all of them disappeared under the full moon. One man has a huge hooked nose and a horribly thick nose ring.
    page: /assets/pictures/evidence_missing_reports.jpg
    requires:
      - c_laptop
    grants:
      - officer_fullmoon
  - id: c_email
    name: Email to himself
    description: "Sent to his own inbox: \"Fwd: missing-person reports — keep this safe. — S\", the whole folder attached. If anyone ever reads his sent items, he's finished."
    page: /assets/pictures/evidence_email.jpg
    requires:
      - c_reports
    grants: []
  - id: c_coords
    name: Map coordinates
    description: A screenshot of a map area with coordinates — the other files in the folder are corrupted, and he is too impatient for them. Fed into Boogle Maps, the pin lands on an abandoned field. It looks a lot like a ground one would get kidnapped at.
    requires:
      - c_email
    grants: []
  - id: c_sedan
    name: Silver sedan
    description: A dusty but luxurious silver sedan, parked at the edge of the field. The number plate reads KA01OC1808.
    grants:
      - officer_plate
  - id: c_backpack
    name: Black backpack
    description: "A black backpack on the seat of the car. Inside: a few cassettes, and nothing else."
    requires:
      - c_sedan
    grants: []
  - id: c_mixtape
    name: The mixtape
    description: Faint crackling, then ritualistic chanting, weird drum sounds, and bizarre words in no language Sameer can decipher. A scream — and then nothing.
    grants: []
  - id: c_vihaan
    name: "Car owner: Vihaan"
    description: "Out on the street, he takes his phone out and looks up the plate: KA01OC1808. One name comes back — Vihaan. He hopes this Vihaan is somehow connected to his missing friend, and not some useless side quest."
    requires:
      - c_mixtape
    grants:
      - mother_vihaan
  - id: c_videos
    name: "Home videos: Parth & Vihaan"
    description: "Grainy home videos: a younger Parth and Vihaan. Vihaan is playing the drums. That drum sound — he just heard it."
    requires:
      - c_vihaan
    grants: []
  - id: c_cd
    name: Copper spiral CD
    description: A transparent case holding a CD, laser-etched with a spiral of copper wiring. It was waiting beneath the gazebo.
    grants: []
  - id: c_laptop_fried
    name: Fried laptop
    description: The motherboard is fried. The service man holds the laptop a bit, tilts it, and asks for an absurd amount of money. Sameer could have done that himself.
    grants: []
  - id: c_footage
    name: The video
    description: "Dark footage, soundless, lit by candles: people playing drums, someone's mouth opened wide, and in the middle of the blur — putrid, disfigured flesh with blood oozing from the wounds. He prays it wasn't human."
    grants: []
  - id: c_veer_profile
    name: "Instalitre: Veer"
    description: "No Vihaan — but a handle called Veer, with Vihaan as the username. Public profile: concerts and drum clips, and a show tomorrow. The type of person Sameer really doesn't want to interact with."
    requires:
      - c_footage
    grants: []
  - id: c_ticket
    name: Normal ticket
    description: One ticket to Veer's show. Normal tier — no backstage, no frills, one very reluctant protagonist.
    grants: []
  - id: c_perigee
    name: The host's announcement
    description: "\"This concert is funded by the Perigee NGO.\" The whole night suddenly has a sponsor — and Sameer's ears prick up."
  - id: c_backstage
    name: Backstage fence
    description: The pass line is right there. Sameer jumps the fence with the confidence of owning the world, and nobody interrupts him.
    requires:
      - c_perigee
  - id: c_apogee
    name: Apogee
    description: "Veer's band borrowed its name from the NGO's orbit: Apogee — the point of the Moon's path farthest from Earth."
  - id: c_workshop_address
    name: Workshop address
    description: Member registration confirmed. The next workshop is at Hutting, 3rd cross, DJ Halli.
  - id: c_workshop
    name: The open-field workshop
    description: "The workshop is in an open field: kids running around, volunteers setting up instruments, snacks in the corner. One kid is practically vibrating like the crickets, rattling off constellations and star positions. It was cute."
  - id: c_hq
    name: Perigee headquarters
    description: "Perigee headquarters is enormous for a four-year-old NGO. Veer walks away to take a call. Near the archive door is a nine-letter motto: A _ C _ N _ I _ N — ‘the soul’s ascent’. A note warns: use the motto to open the archived offering records."
  - id: c_records
    name: offeringRecords
    description: "A folder of .avi videos and a text file: instructions to move the records from physical to digital, with updates on how much has been moved. It stopped on 16-07-2020."
  - id: c_holy_blade
    name: Holy Blade
    description: "A picture file named 'Holy Blade': a blade kept in a beautifully carved handmade box, dark brown with swirl-like carvings; the blade itself simpler, with a metal handle."
    requires:
      - c_records
  - id: c_veer_talk
    name: Nishakara's arms
    description: "Through the flimsy wall: Veer — \"There were so many enthusiastic buds in the field, they were practically waiting to fall in Nishakara's arms.\" A deep, rumbling laugh: \"Children are usually excited about this, they are pure souls. It is in their nature to call their holy mother.\""
    requires:
      - c_records
  - id: c_plea
    name: The parent's plea
    description: "A shattering sound — then a raspy, squeaky voice through the wall: \"You guys need to be stopped, you stole my child, you arses! I hope your face reflects your mind!\" The interrogator, amused: \"Well, there won't be much change then. I look rather handsome. Veer, why don't you go celebrate with others.\" Veer sputtered, but left."
    requires:
      - c_veer_talk
  - id: c_ambulance
    name: Ambulance
    description: The captured man is one of the people who went missing during the full moon. Two people — maybe nurses — tie him up and load him into an ambulance that leaves, talking about taking him to some hospital.
  - id: c_janitor
    name: Janitor's backdoor
    description: He walks in through the janitor backdoor with the world-owning confidence that saved him before. A uniform and a mop, and he is a janitor.
  - id: c_ritual
    name: Third-floor theatre
    description: The room smelled of bleach. A few people surrounded an operating table — the man stuffed into the ambulance. Muffled mid-scream, an injection, then screams in pure agony. One of them chants and ceremoniously opens a carved box of thick incense sticks. Sameer flinches when one touches flesh. A tapestry with the same symbol as the abandoned sedan hangs nearby — the NGO is a cult.
    requires:
      - c_janitor
  - id: c_cameras
    name: Security room
    description: The control panel opens other rooms of the hospital without travelling. He saw things that cannot be described without raising the PG rating of this game.
  - id: c_parth_alive
    name: Parth is alive
    description: Another group surrounded a person, one of them injecting something into the man. Sameer's eyes widened with recognition. It couldn't be — but it was. Parth. Parth was alive.
  - id: c_drug_report
    name: Drug report
    description: A drug report on the desk of some guy named Tanush — it highlighted high amounts of 'Selenocide' in the bloodstream.
  - id: c_timetable
    name: Meeting timetable
    description: "The calendar holds the week's meetings: openings and rituals this person was leading, mostly with higher ups. One member — Enakshi — has meetings only once a week, that too online."
  - id: c_assessments
    name: Mental assessments
    description: A folder of mental assessments dating back years — all of them suggesting high aggression levels and low empathy.
    requires:
      - c_drug_report
  - id: c_tablet_data
    name: The cult tablet
    description: The tablet the handbook says is given to all higher ups — thankfully unlocked.
  - id: c_handbook
    name: Higher-up handbook
    description: "Back home, he finally reads it properly: the chants, the schedules, and the proper maintenance of the 'holy blade' — blood included. He stopped reading after he saw the blood being used. Two lines stuck with him, though: every higher-up is issued a tablet that keeps the same chants, schedules and maintenance notes; and every higher-up answers for the cult's recruitment numbers and its financial records."
  - id: c_enakshi
    name: Enakshi
    description: A woman peeks through the door, her hair greasy and eyes sunken, the house dark behind her. She lets out an animalistic hiss and lunges with a heavy brass candlestick. Sameer shoves her away with the handle of his hammer; she slips on the entryway rug, cracks her head against a wooden table, and slumps to the floor. He binds her wrists with an extension cord, drags her into the hallway closet, and locks the door.
  - id: c_recruits
    name: Recruitment numbers
    description: The number of people recruited by the cult, and its different domains.
  - id: c_finance
    name: Financial records
    description: A spreadsheet of where the cult's funds were collected from and allocated — a lot of donations by a company named Lua Pharmaceuticals.
  - id: c_voice3
    name: The mocking voice note
    description: '"You tried so hard, child; you got so little. Cats usually like to play with rats before swallowing them." A different modified voice this time — mocking.'
  - id: c_pen_camera
    name: Parth's Pen Camera
    description: A pen camera Parth gifted him. Small, discreet — and recording.
  - id: c_ritual2
    name: The Shiniest Mask
    description: "The room was much bigger on the inside: people on the podium in dark robes that glowed green under the candlelight, all wearing wendigo masks, looking at a kneeling man. One mask's horns were adorned with small gems at the base — the Shiniest mask. His deep voice reverberated across the room."
    requires:
      - c_pen_camera
  - id: c_sacrifice
    name: The Sacrifice
    description: A podium member opens a carved box. The sacrifice's back is carved with a crescent moon, blood staining the silver blade. The leader pours a vial of shiny liquid into the open mouth — the man convulses, lets out an animalistic yell, then nothing. The leader takes his pulse and raises his right hand. The crowd roars.
  - id: c_parth_meet
    name: Parth in the Crowd
    description: Sameer spots Parth a few rows behind him and yanks his arm. "I need to be here." "Look, it's either me dying or my mum." "No, I'm not coming, sorry Sameer." Parth's voice turned frigid, then he left.
    requires:
      - c_sacrifice
  - id: c_arrest
    name: The Accusation
    description: People around his home. A police officer takes him away — the story is that he has murdered Enakshi. The police drag him off as he pleads his innocence.
    requires:
      - c_parth_meet
  - id: c_mask
    name: The Wendigo Mask
    description: A wendigo mask on his bed. Decorated, with beautiful lace tied around the horns.
  - id: c_mask_owner
    name: The Leader's Mask
    description: There was only one person with a decorated mask on the podium — The Leader, Tanush.
  - id: c_lua_files
    name: Lua Procurement Logs
    description: Industrial solvents, specialised alkaloid reagents and pharmaceutical binders, sold in separate peptide packs. The amount had reached a level high only in the last year — and it was transported to Nigeria.
  - id: c_article
    name: The Journalist's Last Article
    description: "An article on the second page of Google: a wave of hallucinations and disorders among the kids after the Nigeria workshop, zealous nonsense pushed on them. This was the journalist's last article."
  - id: c_trucks
    name: Cargo into Trucks
    description: Lines of cargo being loaded into trucks at the hospital gate.
  - id: c_disguise
    name: The Lone Worker
    description: A man working away from the group, clueless, mostly left to his own devices. Knocked out with the hammer and pushed into the trunk — once he had changed into worker clothes, his disguise was complete.
    requires:
      - c_trucks
  - id: c_caught
    name: The Hand on His Neck
    description: A hand grabs the back of his neck. "My my, I thought you would be smarter than this Sameer." Sameer freezes.
  - id: c_veer_death
    name: Veer's Neck Snapped
    description: "The leader removes Veer's mask; Veer lunges for it. The leader grabs his neck — a resounding snap is heard throughout the hall. Veer lies crumpled on the floor. The leader bellows: \"oh special one, did you enjoy this?\""
  - id: c_parth2
    name: Parth's Hollow Eyes
    description: "Outside the room, Parth smiles dopily: \"You came! You're going to love this place...\" His eyes looked sunken and his skin like paper."
    requires:
      - c_veer_death
  - id: c_office
    name: The Corner Office
    description: Plush carpets and mahogany furniture — a stark difference from the sterile corridors of the hospital.
puzzles:
  - id: p_morse
    kind: text
    prompt: Decode the groups in Parth's diary, then enter the six-character code. Work from the photograph — the translator he used is on the facing page.
    evidence: /assets/pictures/evidence_diary_morse.jpg
    answers:
      - oc1808
      - oc 1808
      - OC1808
      - OC 1808
      - OC1808 in laptop
      - OC1808 in the laptop
    success: 'Dots and dashes fall into place: O, C, 1, 8, 0, 8. The full line reads "OC1808 in laptop." A very strange thing to encode — but Sameer shelves it for later.'
    grants:
      - c_morse
    requires:
      clues:
        - c_diary
        - c_laptop_locked
    fail_message: Sameer squints at the decoder again. That's not it.
  - id: p_laptop
    kind: code
    prompt: The laptop wakes from sleep mode, cursor blinking in the password field. Looks like he needs to guess the password.
    answers:
      - oc1808
      - oc 1808
    success: He types OC1808 and hits enter. "Heh, I'm in," he mimics, in the worst hacker voice in existence. (Oh god, why is Sameer like this? He wasn't even hacking.)
    grants:
      - c_laptop
    requires:
      clues:
        - c_morse
    fail_message: The password field shakes. Wrong. Again.
  - id: p_email
    kind: email
    prompt: The folder of reports and posters sits open on the laptop. If he is going to keep digging, he needs his own copy — somewhere only he can open. He opens his mail and types his own address.
    evidence: /assets/pictures/evidence_email.jpg
    answers: []
    success: "Sent. The folder lands in his own inbox, attachments and all — \"Fwd: missing-person reports, keep this safe.\" If anyone ever reads his sent items, he's finished."
    grants:
      - c_email
    requires:
      clues:
        - c_reports
  - id: p_cassette
    kind: choice
    prompt: The cassette player whirs to life, waiting. One of Parth's cassettes is already in his hand.
    options:
      - Play it
      - Put it back
    answers:
      - Play it
    success: The mixtape starts with a faint crackling, then ritualistic chanting, weird drum sounds, bizarre words he can't place in any language. There is a scream — and then nothing. He grabs the bag and runs, the shopkeeper screaming at him to pay for the device.
    grants:
      - c_mixtape
    requires:
      clues:
        - c_backpack
    fail_message: Put it back? After the car, after everything? No. He has to hear it.
  - id: p_drums
    kind: text
    prompt: The drum sound. It may be a lead — now, where has he heard drums before?
    answers:
      - cassette
      - the cassette
      - mixtape
      - cassettes
      - in one of the cassettes
      - the mixtape
    success: In one of the cassettes. The same drum sound, from the abandoned car's bag. Remember, Sameer, remember.
    requires:
      clues:
        - c_videos
    fail_message: That's not it. The sound is right there, at the edge of his memory.
  - id: p_dosa
    kind: choice
    prompt: Ramu's Dosa Corner. Parth's usual is steaming in front of him. Should he eat the dosa?
    options:
      - Eat it
      - Skip it
    answers:
      - Eat it
    success: He eats it. It tastes like every other evening they ever spent here. The dosa weighs his stomach; the bag weighs his back.
    fail_message: But he bought it ?
  - id: p_voicenote2
    kind: text
    prompt: |
      Another voice note from Parth's number. Static, then a voice:
      "Where we would go for a walk,
      Where you will sit in shock,
      Find this place before it gets dark,
      The end comes closer in the …"
      The voice note ends like a puzzle waiting to be completed. Where is he sending him?
    answers:
      - park
      - the park
      - gazebo
      - the gazebo
      - park gazebo
      - the park gazebo
      - the gazebo in the park
    success: The park. The gazebo where he last saw Parth. He pockets the phone and leaves before it gets dark.
    fail_message: That's not it. The voice note is still waiting to be completed.
  - id: p_cd_mode
    kind: choice
    prompt: The copper spiral CD sits in its transparent case. His own laptop, or the cyber cafe down the road?
    options:
      - Use my laptop
      - Use the cyber cafe
    answers:
      - Use the cyber cafe
    success: "He goes to the cyber cafe in a rudimentary disguise, sends a quick prayer, and inserts the CD. The desktop survives. Most of the videos are dark — drums, candles, someone's mouth opened wide — but one frame will not leave him: putrid, disfigured flesh. He prays it wasn't human."
    fail_message: The laptop instantly short-circuits. He swears and yanks the CD out. The service man says the motherboard is fried — and charges him an absurd amount for holding and tilting it. The CD survived. He will have to play it at Ramu's.
    fail_grants:
      - c_laptop_fried
    grants:
      - c_footage
    requires:
      clues:
        - c_cd
    continue_on_fail: true
  - id: p_cd_watch
    kind: choice
    prompt: The fried laptop is at the service centre, but the spiral CD survived. Ramu's cyber cafe has a machine old enough to trust. Insert it?
    options:
      - Insert the CD
      - Leave it
    answers:
      - Insert the CD
    success: "The desktop survives, and the CD drive opens. Dark footage, lit only by candles: people playing drums, someone's mouth opened wide — and in the middle of the blur, putrid, disfigured flesh with blood oozing from the wounds. He prays it wasn't human."
    fail_message: He can't walk away now. The CD goes in.
    grants:
      - c_footage
    requires:
      clues:
        - c_laptop_fried
  - id: p_video_noise
    kind: text
    prompt: The video had no sound — drums, a wide-open mouth, the blur. Can he fit this noise anywhere?
    answers:
      - mixtape
      - the mixtape
      - cassette
      - the cassette
    success: The mixtape. The same drums, the same chant — he wondered why they had recorded the video and the audio separately.
    requires:
      clues:
        - c_footage
    fail_message: No — the sound is right there, at the edge of his memory. It belongs to the mixtape.
  - id: p_ticket
    kind: choice
    prompt: Veer's show, tomorrow. Two kinds of tickets — normal, and backstage at fifty percent more. Is it worth it?
    options:
      - Normal ticket
      - Backstage ticket
    answers:
      - Normal ticket
    success: Sameer buys the normal ticket. He really doesn't want to do this — he doesn't want to involve more people into this than required.
    fail_message: The backstage ticket is daylight robbery — fifty percent more for a man with barely a million followers? He clicks back. The normal ticket is the one.
    grants:
      - c_ticket
    requires:
      clues:
        - c_veer_profile
  - id: p_veer_1
    kind: choice
    prompt: "He waits, and then he meets his lead. \"Hey, I discovered your band a couple of days ago, I loved your second song! The electric beats and modified voice were amazing additions.\" Veer chuckles: \"Yeah, the additions were my idea. I had to fight almost the entire band to put that in. I'm so glad that y'all liked it so much!\" Then Sameer says, \"You guys are funded by The Perigee? That's a new sight for me. I thought that bands would fund NGOs!\" Veer puts down his water bottle and assesses him: \"Why — you're a part of it?\" What should Sameer say?"
    options:
      - Yes, I'm part of it
      - No, but I have donated some money to them
    answers:
      - No, but I have donated some money to them
    success: "Veer straightened up: \"Oh that's great — you know what they do, right?\""
    fail_message: Veer's smile thins. Sameer instantly regrets it — he fumbles and tries again.
  - id: p_veer_2
    kind: choice
    prompt: "\"Oh that's great — you know what they do, right?\""
    options:
      - Foster scientific temper, empowering the youth
      - Teach astronomy to tourists
    answers:
      - Foster scientific temper, empowering the youth
    success: "Veer looks impressed: \"That's great! I have believed the same thing. We actually got inspired by the NGO's name to change our band name — we still wanted to keep our theme of being at the peak or at the highest of all.\""
    fail_message: Veer tilts his head. That is not what the NGO is about, and he knows it.
  - id: p_band_name
    kind: text
    prompt: Sameer thought — what was their band name again?
    answers:
      - apogee
    success: "Apogee — of course. \"The point of the Moon's orbit farthest from Earth,\" Veer explains. \"Perigee is where it is closest. We wanted to keep our theme of being at the peak, at the highest of all.\" Sameer's mind was racing: he may have stumbled into a gold mine of clues."
    grants:
      - c_apogee
  - id: p_registration
    kind: email
    prompt: Veer sends him the link for member registration. It doesn't ask for much — just an email and an OTP. He needs the address he actually owns — the one from his sent mail.
    evidence: /assets/pictures/evidence_email.jpg
    answers:
      - sameer@gotmail.com
    success: 'The registration goes through. A volunteer confirms his membership and sends the address of the upcoming workshop: "Hutting, 3rd cross, DJ Halli." He has a gut feeling that all that is happening to him has a reason and a rhyme — including the fact that he lost his phone charger a couple of days ago.'
    fail_message: The OTP never arrives. That isn't his inbox — he has to sign up with the address from his sent mail.
    grants:
      - c_workshop_address
  - id: p_fare
    kind: scene
    prompt: He plans to go to the workshop and finds an auto.
    lines:
      - speaker: narrator
        text: He plans to go to the workshop and finds an auto. "Where do you want to go, sir?" — "Hutting, 3rd cross, DJ Halli." — "300."
      - speaker: sameer
        text: "\"The hell — I'll give 100, no more.\""
      - speaker: narrator
        text: '"Ok sir, find someone else then." Sameer looked around; the auto guy looked at him. Sameer sighed.'
      - speaker: sameer
        text: "\"I can't give more than 200.\""
      - speaker: narrator
        text: '"230." Sameer sighed and got into the auto. After that daylight robbery, he saw the workshop: it was in an open field, kids were running around and volunteers setting up the instruments for observation.'
    requires:
      clues:
        - c_workshop_address
      puzzles:
        - p_destination
    success: '"230." Sameer sighed and got into the auto. After that daylight robbery, he saw the workshop: it was in an open field, kids were running around and volunteers setting up the instruments for observation.'
  - id: p_ascension
    kind: code
    prompt: "The archive terminal asks for the nine-letter motto from the headquarters: A _ C _ N _ I _ N. Beneath it: ‘the soul’s ascent’. What is the password?"
    answers:
      - ascension
    success: Blue light reflects on his face; the records open. A folder named "offeringRecords" — a bunch of .avi videos. Huh, he has never seen this extension before.
  - id: p_playback
    kind: choice
    prompt: A folder full of .avi videos, an extension he has never seen. Would it even play on his laptop?
    options:
      - It will play
      - It won't play
    answers:
      - It won't play
    success: "It won't play. Damn — he would need the cyber cafe again. He doesn't trust the system to not blast loud sound, so he opens a text file instead: instructions to move the records from physical to digital, updates on how much has been moved. It stopped on 16-07-2020."
    grants:
      - c_records
    requires:
      puzzles:
        - p_ascension
    fail_message: It plays? No — a file like that would never open on his laptop. He'd need the old machines at Ramu's.
  - id: p_destination
    kind: text
    prompt: He plans to go to the workshop and finds an auto. "Where do you want to go, sir?"
    answers:
      - hutting 3rd cross dj halli
      - hutting
      - 3rd cross dj halli
      - dj halli
    success: "\"Hutting, 3rd cross, DJ Halli.\" The volunteer's message had the address."
    requires:
      clues:
        - c_workshop_address
    fail_message: The driver waits. Sameer digs out the volunteer's message and reads the address again.
  - id: p_hide
    kind: choice
    prompt: 'He hid under the desk. The door opened, Veer looked in — Sameer huddled his feet closer to himself. He heard a mutter: "We really need to get better security." Then a scream cut both men off. Veer left the door open, deciding whether to check the room or leave for the scream. Should Sameer take the risk and run?'
    options:
      - Run
      - Stay hidden
    answers:
      - Stay hidden
    fail_message: Veer catches a glimpse of him running — he starts yelling. This was the wrong decision; he had to go quickly before the rest of those freaks were alerted. He found the exit just in time to escape.
    success: Too risky. Veer enters the room and goes for the desk — shoot, he left the system on, he should have run. Veer rummaged through it, but thankfully Sameer had closed all the tabs. Veer looked around and then left. Sameer ran towards the nearest exit, hid near the trash cans, and peeked through. Wait — the man was familiar. One of the people who went missing during the full moon, struggling and frantically calling for help. Two people — maybe nurses — tied him up and loaded him into an ambulance that left, talking about taking him to some hospital.
    grants:
      - c_ambulance
  - id: p_delve
    kind: choice
    prompt: The captured man is struggling, frantically calling for help; two people — maybe nurses — tie him up, and the ambulance leaves talking about taking him to some hospital. Should he delve deeper into this NGO?
    options:
      - Yes
      - No
    answers:
      - Yes
    fail_message: '"No" sits on his tongue — and he hates himself for even thinking it. There is no way out of this now. He has to go deeper. (One penalty.)'
    success: He is going to put his life in danger if he delves deeper, but he has to. The police are nearly incompetent and apparently children are being captured too. He needs to expose them, or bring light to this, or something. He has to. The next morning, Sameer wakes up with a plan.
  - id: p_hospital
    kind: choice
    prompt: The next morning he wakes with a plan. If there is torture happening, it won't be a normal hospital — it would be some sort of abandoned or isolated one. Which hospital should he pick?
    options:
      - Vyadha Hospital
      - Shashdhar Hospital
      - BMC Hospital
    answers:
      - Shashdhar Hospital
    fail_message: The wards of the wrong hospital scroll past — normal, staffed, full of visitors. Nobody would hide a torture room there. He scrolls back to the top and tries again.
    success: Shashdhar Hospital — old and isolated, out on the outskirts of the city. The only one that fits. He feels it in his gut. He drives out to the outskirts, walks in through the janitor backdoor with the world-owning confidence that saved him before, and grabs a uniform and a mop to pose as a janitor.
  - id: p_security_pin
    kind: text
    prompt: 'He turns left and finds what he thinks is a security room. The control panel is locked, and a note is taped to it: "vykpmng vykpmng nkvvng ____". The panel wants the missing word.'
    answers:
      - uvct
      - star
    success: "Each letter is shifted two places ahead: vykpmng becomes twinkle, nkvvng becomes little, uvct becomes star. Twinkle twinkle little star. The panel unlocks — he can check out other rooms of the hospital without travelling."
    grants:
      - c_cameras
  - id: p_parth_alive
    kind: text
    prompt: One group caught Sameer's attention — they were also surrounding a person, one of them injecting something into the man. Sameer's eyes widened with recognition. It couldn't be, could it?
    answers:
      - parth
    fail_message: No — focus. If not him, then... what is this entire thing about??
    success: Parth. Parth was alive.
    grants:
      - c_parth_alive
  - id: p_tablet
    kind: code
    prompt: There was a tablet under these folders. It was unfortunately password protected — a 4-digit numeric passcode. The higher-ups seem to love dates — one date above all, the one the archived records stopped on. What could he put down?
    answers:
      - "1607"
      - 16-07-2020
      - 16/07/2020
      - "16072020"
      - 16 07
    success: 1607 — the day the records stopped. The tablet unlocks in his hands; this is the Big Bad's own device.
    requires:
      clues:
        - c_records
  - id: p_handbook
    kind: choice
    prompt: He heard footsteps in the corridor. There is a handbook kept near the reports. Should he pick it up?
    options:
      - Take it
      - Leave it
    answers:
      - Take it
    fail_message: The footsteps grow louder. He leaves the handbook where it lies — and hates himself for it. There is still time.
    success: "He quickly grabs the handbook and leaves the room. He leaves the hospital, hoping he goes undetected. Back home, he finally reads it properly: the chants, the schedules, and the proper maintenance of the 'holy blade'. He stops at the blood, but two lines stick with him: every higher-up is issued a tablet, and every higher-up answers for the cult's recruitment numbers and its financial records."
    grants:
      - c_handbook
  - id: p_knowledge
    kind: text
    prompt: The tablet is thankfully unlocked. How did he know about the tablet given by the cult?
    answers:
      - handbook
      - the handbook
    success: The handbook. Somewhere in those pages, between the chants and the maintenance of the holy blade, it said a tablet is given to all higher ups. The tablet's screen glows in his hand.
    grants:
      - c_tablet_data
    requires:
      clues:
        - c_handbook
      puzzles:
        - p_tablet
  - id: p_tablet_content
    kind: choice
    prompt: What could be found in the tablet?
    options:
      - Chants, schedules, and holy blade maintenance
      - Financial records
      - The full member list
    answers:
      - Chants, schedules, and holy blade maintenance
    requires:
      clues:
