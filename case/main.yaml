  - id: act5
    type: interactive
    kicker: Act V
    title: The Big Bad
    entry_room: tanush_office
    rooms:
      - tanush_office
      - enakshi_house
      - sameer_room
    objective: Expose the cult. Gather proof from the Big Bad's office and from Enakshi's house.
    intro:
      - speaker: narrator
        text: He can't act like a fool right now. He has no idea who Parth is against and who he is allied with; one wrong move and it could be his skin being burned.
      - speaker: narrator
        text: "He hears the security guard coming and picks up the mop. The guard looks at him in disgust: \"How many times have I told you to not come so close to the systems!\" Sameer looks to the ground: \"There were crumbs near the screens.\" The guard looks him over — \"You're Shyam's replacement?\" — \"Huh, yeah, I was hired yesterday. He loved my mopping technique. You know, just swish and flick.\""
      - speaker: narrator
        text: A swish and a flick, and he was outside the door. He wants to go home and sleep, maybe yell at Parth for getting him into this goose chase — then he finds a beautifully decorated room, with plush carpets and mahogany furniture, a stark difference from the sterile corridors of the hospital. This has to be the office of some higher up.
    outro:
      - speaker: narrator
        text: He's been staring at his phone for about 3 hours now; that's not so bad if you consider his doomscrolling times. It was hard work for his brain, especially when he can't properly connect and visualise the data.
      - speaker: narrator
        text: 'Just as he is about to go to sleep, he gets a notification. Another voice note — a different modified voice this time, mocking: "You tried so hard, child; you got so little. Cats usually like to play with rats before swallowing them."'
      - speaker: narrator
        text: The email he sent to himself gave him away. A deranged cult is following him now, and he is awake the entire night in terror.
