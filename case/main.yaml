characters:
  - id: sameer
    name: Sameer
    persona: "The player character: anxious, sarcastic, painfully loyal to Parth. Talks to himself when he's scared, and he's scared a lot now."
    goals:
      - Find Parth
      - Make sense of the voice note
      - Follow every lead before it goes cold
    demeanor: anxious
    deflections:
      - Sameer drums his fingers on his thigh and changes the subject.
      - Sameer laughs too loudly. "Yeah. Anyway —"
    snubs:
      - Sameer stares. "Are we doing this or not?"
      - Sameer shakes his head. "That's not even a question."
    facts:
      - id: sameer_quest
        text: Parth has been missing for days. The voice note told him to look where Parth's thoughts rest.
        unlock: always
        disposition: admit
      - id: sameer_jade
        text: Jade Street ghosted him the day Parth vanished. He'd rather think about that than about the voice note.
        unlock: always
        disposition: admit
  - id: parth
    name: Parth
    persona: "The missing friend: charming, evasive, keeps secrets behind jokes. Anything he says is a clue."
    goals:
      - Keep his secrets
      - Protect Sameer from what he knows
    demeanor: charming
    deflections:
      - Parth laughs it off like it was a joke.
      - Parth shrugs. "It's nothing. You know me."
    snubs:
      - Parth's smile doesn't reach his eyes. "Drop it, man."
      - Parth suddenly finds his phone very interesting.
    facts:
      - id: parth_lie
        text: He said his mother called and he had to leave the gazebo early — but she never called. He told her Sameer had left early.
        unlock: always
        disposition: deny
      - id: parth_vihaan
        text: Vihaan was his childhood friend. The old home videos show the two of them together — Vihaan playing the drums.
        unlock:
          requires:
            - c_videos
        disposition: deflect
  - id: mother
    name: Parth's Mother
    persona: Grieving, hopeful, guilty about the last conversation. Measure every word — she is hiding something too.
    goals:
      - Get her son back
      - Not be blamed
    demeanor: guarded
    deflections:
      - Parth's mother looks up the stairs with unshed tears.
      - She wipes her hands on her saree and says nothing for a moment.
    snubs:
      - Her voice cracks. "Parth will explain everything when he comes back."
      - She turns to the photo on the wall. "He's coming back."
    facts:
      - id: mother_alibi
        text: Parth left home about an hour before Sameer rang the doorbell. He told her he was going to meet Sameer at the park.
        unlock: always
        disposition: admit
      - id: mother_room
        text: She let Sameer search Parth's room and begged him not to disturb anything — Parth would have a hard time finding his things once he comes back.
        unlock:
          requires:
            - c_diary
        disposition: admit
      - id: mother_vihaan
        text: Vihaan was Parth's childhood friend. There are old home videos of the two of them — Vihaan on the drums.
        unlock:
          requires:
            - c_videos
        disposition: admit
  - id: officer
    name: Officer Rao
    persona: Cynical station officer, powered by masala dosa and procedure. Warms up if you bring him something real.
    goals:
      - Close the file with the least work possible
      - Not miss an actual crime under his nose
    demeanor: cooperative
    deflections:
      - The officer flips a greasy page and pretends not to hear.
      - The officer takes a slow bite of his masala dosa instead of answering.
      - Officer Rao wipes his fingers on a napkin and turns a page of the case file.
      - Officer Rao sighs. "These things take time, bhai."
    snubs:
      - The officer points his pen at the queue behind you. "Next."
      - The officer sighs. "Write it down and leave it on the desk."
      - Officer Rao raises his eyebrows. "That's all you have?"
      - Officer Rao goes back to his masala dosa.
    facts:
      - id: officer_rule
        text: Missing cases can only be filed 48 hours after the person was last seen. Procedure, ma'am.
        unlock: always
        disposition: admit
      - id: officer_fullmoon
        text: Every missing-person report in Parth's folder vanished under a full moon. The station stopped chasing that pattern years ago.
        unlock:
          requires:
            - c_reports
        disposition: deny
      - id: officer_plate
        text: The plate KA01OC1808 belongs to a Vihaan — the sedan was his. It's the only name attached to any of this.
        unlock:
          requires:
            - c_sedan
        disposition: admit
      - id: officer_act6_dosa
        text: He is having a masala dosa and flipping through cases with greasy fingers.
        unlock: always
        disposition: admit
      - id: officer_act6_pattern
        text: "The reports line up: missing people, gone posters, a full-moon calendar. The station filed the pattern away and forgot it."
        unlock:
          requires:
            - c_reports
        disposition: admit
      - id: officer_act6_charge
        text: Sameer is being held for the murder of Enakshi — the woman from the house across the lane.
        unlock:
          requires:
            - c_arrest
        disposition: admit
      - id: officer_act6_cases
        text: The dates in Sameer's files trace at least five missing cases to the same cult.
        unlock:
          requires:
            - c_arrest
        disposition: admit
      - id: officer_act6_mask
        text: No one at the station will admit to leaving a wendigo mask on Sameer's bed.
        unlock:
          requires:
            - c_mask
        disposition: deflect
  - id: veer
    name: Veer
    persona: Vihaan — the drummer who now goes by Veer. Charming, loud, thirsty for recognition, and wrapped up in the Perigee NGO's orbit. His band is Apogee. Friendly to fans, guarded about the NGO's inner workings.
    goals:
      - Keep the band clean of the NGO
      - Not think too hard about what Parth was doing
      - Keep the band funded and growing
      - Stay on the NGO's good side
      - Never ask too many questions himself
    demeanor: cooperative
    deflections:
      - Veer takes a long sip of water and looks at the stage.
      - Veer chuckles and steers the talk back to the band.
      - Veer laughs and takes another swig of water. "Man, that's a lot of questions for a fan."
      - Veer taps his monitor and shrugs. "I only play music, bro. The NGO people handle the rest."
    snubs:
