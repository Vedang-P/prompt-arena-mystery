    objective: Follow Veer and the Perigee NGO. Find out what Parth was doing there.
    intro:
      - speaker: narrator
        text: Sameer is in the concert. There is not much crowd, but the vibes are good — he wishes there was a water station around, or maybe food stalls. It's really just a temporary stage propped up; the lights are cool though.
      - speaker: narrator
        text: The band is a mix of industrial rock and electronic dance. They all have voice modifiers and rely on heavy synthesizers. He honestly enjoys the music — he should search it up later.
      - speaker: narrator
        text: "As the band closes, the host takes the mic: \"This concert is funded by the Perigee NGO.\" This makes Sameer's ears prick up. He needs to talk to Veer — or Vihaan, whoever this guy is. This may be the only lead he has to his friend."
      - speaker: narrator
        text: He looks around as the concert ends and spots a line for people with backstage passes. Now he just needs to go in.
    outro:
      - speaker: narrator
        text: He hides near the trash cans and peeks through. The captured man is struggling, frantically calling for help. Two people — maybe nurses — tie him up and load him into an ambulance.
      - speaker: narrator
        text: The ambulance leaves, talking about taking him to some hospital. Sameer is going to put his life in danger if he delves deeper, but he has to — children are being captured too. He needs to expose them, or bring light to this, or something.
      - speaker: narrator
        text: The next morning, Sameer wakes up with a plan.
