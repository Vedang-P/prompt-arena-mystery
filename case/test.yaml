# Engine test fixture — NOT game content. A miniature case that exercises
# clue gating, fact unlocking, dispositions, the canonical fallback, and the
# schema-v2 puzzles / interactive acts / endings plumbing.

title: "Engine Fixture"

solution:
  culprit: butler
  method: "Took the ledger and burned it."
  motive: "To hide the debts."
  required_clues: [ledger]

endings:
  - id: ending_cult
    title: "The Cult"
    body: "The butler slips away to join the cult, and the debts stay buried."

rooms:
  - id: study
    name: "The Study"
    scene: study
    hotspots:
      - { id: butler_spot, type: character, character: butler, label: "The Butler", position: [0, 0, 0] }
      - { id: drawer_spot, type: clue, clue: key, label: "Drawer", position: [1.4, 0, -0.4] }
      - { id: desk_spot, type: clue, clue: ledger, label: "Ledger", position: [-1.2, 0, 0.6], requires: { clues: [key] }, act: act1 }
      - { id: hearth_spot, type: puzzle, puzzle: p_ash, label: "Fireplace", position: [1.8, 0, 0.2], requires: { clues: [key] } }
      - { id: tape_spot, type: puzzle, puzzle: p_play, label: "Cassette player", position: [-0.6, 0, 1.2] }
      - { id: cellar_door, type: travel, to: cellar, label: "Cellar door", position: [2.4, 0, 0] }
  - id: cellar
    name: "The Cellar"
    scene: cellar
    hotspots:
      - { id: study_door, type: travel, to: study, label: "Stairs up", position: [0, 0, 0] }
      - { id: ending_spot, type: puzzle, puzzle: p_ending, label: "A final choice", position: [0.8, 0, -0.8] }
      - { id: contact_spot, type: puzzle, puzzle: p_contact, label: "A dusty terminal", position: [-0.8, 0, -0.8] }

characters:
  - id: butler
    name: "The Butler"
    persona: "Old, precise, unimpressed."
    goals: ["Protect the household"]
    demeanor: guarded
    deflections:
      - "The butler adjusts his cuffs and says nothing."
      - "The butler inspects a speck of dust on the mantelpiece."
      - "The butler folds his hands behind his back and waits."
      - "A clock ticks somewhere in the hall. He does not acknowledge it."
      - "The butler straightens the cutlery already laid straight."
      - "\"If sir has no further questions, I have duties.\""
      - "He studies the carpet as though it might answer for him."
      - "The butler clears his throat, quietly, and says nothing."
      - "\"The household does not discuss its private affairs.\""
      - "He adjusts the curtains by a finger's width."
      - "\"Perhaps ask the staff below stairs.\""
      - "The butler inclines his head, which is not an answer."
      - "He polishes a glass that is already spotless."
      - "\"I am sure everything will come to light in time.\""
      - "The butler consults a pocket watch he did not need to consult."
      - "\"Will there be anything else, sir?\""
      - "He closes the door to the hallway without being asked."
      - "The butler murmurs something about the evening's arrangements."
      - "\"I could not possibly speculate, sir.\""
      - "He returns a book to its shelf, spine perfectly aligned."
    snubs:
      - "The butler raises one eyebrow. \"Indeed.\""
      - "The butler sighs through his nose. \"Will that be all, sir?\""
    facts:
      - id: butler_alibi
        text: "He claims he was in the kitchen all evening."
        unlock: always
        disposition: admit
      - id: butler_secret
        text: "He burned the ledger to hide the master's debts."
        unlock: { requires: [ledger] }
        disposition: deny
      - id: butler_detail
        text: "The ashes were still warm when the maid found them."
        unlock: { after: [butler_secret] }
        disposition: deflect
  - id: maid
    name: "The Maid"
    persona: "Nervous, eager to help."
    goals: ["Keep her job"]
    demeanor: cooperative
    deflections:
      - "The maid pretends to be very busy with a duster."
    snubs:
      - "The maid blinks at you. \"Sorry, sir?\""
    facts:
      - id: maid_alibi
        text: "She was polishing the silver until midnight."
        unlock: always
        disposition: admit
      - id: maid_ash
        text: "She says the fireplace was still warm at dawn."
        unlock: { requires: [ash] }
        disposition: admit

clues:
  - id: key
    name: "Drawer key"
    description: "A small brass key, still warm."
    grants: []
  - id: ledger
    name: "Charred ledger"
    description: "What is left of it. The corners are missing."
    requires: [key]
    grants: [butler_secret]
  - id: ash
    name: "Cold ashes"
    description: "Something bound in leather was burned here."
    grants: [maid_ash]
  - id: mixtape
    name: "Hissing tape"
    description: "A cassette the butler kept well hidden."

puzzles:
  - id: p_ash
    kind: text
    prompt: "What did the butler burn?"
    answers: [ledger, the ledger]
    success: "The ashes give up the ledger's hiding place."
    grants: [ash]
  - id: p_play
    kind: choice
    prompt: "The cassette player still turns over. What do you do?"
    options: ["Play it", "Put it back"]
    answers: ["Play it"]
    success: "The tape hisses to life."
    grants: [mixtape]
  - id: p_risky
    kind: choice
    prompt: "Footsteps creak overhead."
    options: ["Run", "Stay hidden"]
    answers: ["Stay hidden"]
    success: "You stay put, and the footsteps pass."
    fail_message: "You bolt, and a hand catches your sleeve."
    continue_on_fail: true
    fail_grants: [ash]
    requires: { clues: [mixtape] }
  - id: p_ending
    kind: choice
    prompt: "One last choice."
    options: ["Continue", "Stop"]
    answers: ["Continue"]
    success: "You go on."
    option_endings: { "Stop": ending_cult }
  - id: p_contact
    kind: email
    prompt: "Leave an email for the archive."
    success: "The archive accepts your details."
  - id: p_register
    kind: email
    prompt: "The archive sends a one-time code to the address on record."
    answers: [sameer@example.com]
    success: "The archive confirms the code."
    fail_message: "No code arrives. That address is not on record."
  - id: p_scene
    kind: scene
    prompt: "The cellar lamp gutters as someone crosses the floor."
    lines:
      - { speaker: narrator, text: "The lamp gutters. Footsteps cross the cellar floor." }
      - { speaker: butler, text: "You should not have followed me down here." }
    success: "The scene plays out; nothing is asked of the detective."

acts:
  - id: act0
    type: cinematic
    kicker: "Act 0"
    title: "The Vanish"
    subtitle: "He was gone."
    scenes: [study]
    beats:
      - id: b1
        room: study
        shot: wide
        seconds: 3
        lines:
          - { speaker: narrator, text: "The study was empty." }
  - id: act1
    type: interactive
    kicker: "Act I"
    title: "The Study"
    entry_room: study
    rooms: [study, cellar]
    objective: "Learn what the butler burned."
    intro:
      - { speaker: narrator, text: "The fire is still warm." }
    outro:
      - { speaker: butler, text: "You should not have looked." }
    complete:
      clues: [mixtape]
      puzzles: [p_risky]

canonical_qa:
  - character: butler
    q: "where were you tonight"
    keywords: [where, tonight]
    a: "In the kitchen, as I said."
